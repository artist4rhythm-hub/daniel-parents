<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 개설 신청 · 강사 포털</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="logo-daniel-color.png">
<style>
:root{--pt:#1E3932;--gold:#D8B45A;--cream:#FBFAF7;--ink:#22262B;--ink2:#5A5F66;--ink3:#8A8F98;--line:#E7E4DC;--wh:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.top{background:var(--pt);color:#fff;padding:22px 18px 18px;text-align:center}
.top h1{font-size:19px;font-weight:900}
.top p{font-size:12.5px;opacity:.8;margin-top:4px}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 50px;transition:max-width .2s}
body.w-narrow .wrap{max-width:680px}
body.w-wide .wrap{max-width:96vw}
.wsel{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:9px;font-size:11px}
.wsel button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:100px;padding:4px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.wsel button.on{background:#fff;color:var(--pt);border-color:#fff}
.sess-scroll{overflow-x:auto}
.sess-scroll table.tb{min-width:780px}
.tb-sess td{vertical-align:middle}
.cwrap{position:relative;padding-left:16px}
.cwrap input{padding-left:8px}
.mgb{position:absolute;left:-2px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--wh);border-radius:6px;width:16px;height:22px;font-size:10px;color:var(--ink3);cursor:pointer;padding:0;line-height:1}
.mgb:hover{color:var(--pt);border-color:var(--pt)}
.mgc{background:#FBFAF4}
.mgf{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:3px}
.mgf a{color:#B45309}
.bigbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.bigbox{background:var(--wh);border-radius:14px;max-width:560px;width:100%;padding:18px 20px}
.bigbox textarea{min-height:130px;font-size:15px;line-height:1.7}
.card{background:var(--wh);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:900;color:var(--pt);margin-bottom:10px}
label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--wh)}
textarea{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.btn{background:var(--pt);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:#1E3932}
.btn.line{background:var(--wh);color:var(--ink2);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert{display:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}.alert.err{display:block;background:#FDECEA;color:#C0392B}.alert.info{display:block;background:#EFF6FF;color:#1D4ED8}
.pill{display:inline-block;border-radius:100px;padding:3px 10px;font-size:10.5px;font-weight:800;background:#F1F0EC;color:#6B7280}
.pill.ok{background:#DCFCE7;color:#15803D}.pill.blue{background:#DBEAFE;color:#1D4ED8}.pill.warn{background:#FEF3C7;color:#B45309}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--wh);border-radius:10px;padding:11px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.seg button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.wd{display:flex;gap:6px}
.wd label{margin:0;flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 0;text-align:center;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink2)}
.wd input{display:none}
.wd label.on{background:var(--pt);border-color:var(--pt);color:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.tb th{background:#F3F1EA;color:var(--pt);padding:7px 6px;text-align:left;font-size:11.5px}
table.tb td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb td input{padding:6px 8px;font-size:12.5px;border-radius:7px}
tr.blocked td{background:#FEF2F2;color:#B91C1C;font-size:12px}
.fee{background:#FFF8E6;border:1px solid #F0DFAE;border-radius:12px;padding:12px 14px;font-size:13px}
.fee b{font-size:18px;color:var(--pt)}
.my{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:11.5px;color:var(--ink3)}
.step{display:none}.step.on{display:block}
</style>
</head>
<body>
<div class="top">
  <h1>🎨 방과후 동아리 · 조이클래스 개설 신청</h1>
  <p id="top-sub">이메일만 있으면 계정 없이 바로 작성할 수 있어요</p>
  <div class="wsel" id="wsel">
    <span style="opacity:.7">화면 폭</span>
    <button data-w="narrow" onclick="setW('narrow')">좁게</button>
    <button data-w="normal" onclick="setW('normal')">보통</button>
    <button data-w="wide" onclick="setW('wide')">넓게</button>
  </div>
</div>
<div class="wrap">

  <!-- 로그인 -->
  <div class="step on" id="st-login">
    <div class="card">
      <h3>로그인</h3>
      <div class="seg" style="margin-bottom:12px">
        <button class="on" id="m-link" onclick="setMode('link')">✉️ 이메일 링크</button>
        <button id="m-pw" onclick="setMode('pw')">🔑 이메일+비밀번호</button>
        <button id="m-staff" onclick="setMode('staff')">🏫 교직원 아이디</button>
      </div>
      <div id="f-link">
        <label>이메일</label><input type="email" id="l-email" placeholder="예: teacher@naver.com" autocomplete="email">
        <div class="small" style="margin-top:6px">입력한 이메일로 로그인 링크를 보내드립니다. 링크를 누르면 로그인돼요. (처음이시면 이 방법으로)</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="b-send" onclick="sendLink()">로그인 링크 받기</button></div>
      </div>
      <div id="f-pw" style="display:none">
        <label>이메일</label><input type="email" id="p-email" autocomplete="email">
        <label>비밀번호</label><input type="password" id="p-pw" autocomplete="current-password">
        <div class="row" style="margin-top:10px"><button class="btn" onclick="pwLogin()">로그인</button></div>
        <div class="small" style="margin-top:6px">비밀번호는 처음 링크로 로그인한 뒤 «내 정보»에서 만들 수 있어요. 잊으셨다면 이메일 링크로 다시 로그인해 새로 만드세요.</div>
      </div>
      <div id="f-staff" style="display:none">
        <label>교사 선교사 아이디</label><input type="text" id="s-id" autocomplete="username">
        <label>비밀번호</label><input type="password" id="s-pw" autocomplete="current-password">
        <div class="row" style="margin-top:10px"><button class="btn" onclick="staffLogin()">로그인</button></div>
      </div>
      <div class="alert" id="l-msg"></div>
    </div>
  </div>

  <!-- 링크 처리 중 -->
  <div class="step" id="st-verify"><div class="card" style="text-align:center"><div style="font-size:30px">🔐</div><p id="v-label">로그인 확인 중…</p></div></div>

  <!-- 메인 -->
  <div class="step" id="st-main">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b id="me-name"></b> <span class="small" id="me-email"></span></div>
        <div class="row"><button class="btn line" onclick="showProfile()">👤 내 정보·계좌</button><button class="btn line" onclick="logout()">로그아웃</button></div>
      </div>
    </div>
    <div class="card" id="sem-card"></div>
    <div id="my-list"></div>
    <div id="form-area"></div>
  </div>

  <!-- 내 정보 -->
  <div class="step" id="st-profile">
    <div class="card"><h3>👤 내 정보</h3>
      <div class="g2">
        <div><label>이름</label><input id="pf-name"></div>
        <div><label>연락처</label><input id="pf-phone" placeholder="010-0000-0000"></div>
      </div>
      <h3 style="margin-top:14px">💳 입금 계좌 (강사료 정산용)</h3>
      <div class="g2">
        <div><label>은행</label><input id="pf-bank"></div>
        <div><label>계좌번호</label><input id="pf-acct"></div>
        <div><label>예금주</label><input id="pf-holder"></div>
      </div>
      <h3 style="margin-top:14px">🔑 비밀번호 만들기·변경 (선택)</h3>
      <div class="g2">
        <div><label>새 비밀번호 (6자 이상)</label><input type="password" id="pf-pw1" autocomplete="new-password"></div>
        <div><label>한 번 더</label><input type="password" id="pf-pw2" autocomplete="new-password"></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn" onclick="saveProfile()">저장</button><button class="btn line" onclick="showMain()">돌아가기</button></div>
      <div class="alert" id="pf-msg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink,
  signInWithEmailAndPassword, updatePassword, setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
await setPersistence(auth, browserLocalPersistence).catch(()=>{});

const $ = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const WD = ['일','월','화','수','목','금','토'];
const EMAIL_KEY = 'club_login_email';
window.setW = (w)=>{
  document.body.classList.remove('w-narrow','w-wide');
  if(w==='narrow') document.body.classList.add('w-narrow');
  if(w==='wide') document.body.classList.add('w-wide');
  try{ localStorage.setItem('club_width', w); }catch(e){}
  document.querySelectorAll('#wsel button').forEach(b=>b.classList.toggle('on', b.dataset.w===w));
};
setW(localStorage.getItem('club_width') || 'normal');
const qs = new URLSearchParams(location.search);
const SEM_ID = qs.get('sem') || localStorage.getItem('club_sem') || '';
if(qs.get('sem')) localStorage.setItem('club_sem', qs.get('sem'));

let ME=null, PROF=null, SEM=null, MY=[], EDIT=null, SESSIONS=[], IS_STAFF=false;
/* 🖼 자동 포스터 테마 — [배경1, 배경2, 포인트] */
const PTHEMES = { navy:['#0C2A44','#1E4B74','#D8B45A'], forest:['#1E3932','#2E5A47','#EAD9A0'],
  plum:['#5E4B8B','#8A6FC0','#F6EDFF'], sunset:['#B4530A','#E28413','#FFF3DF'], ink:['#22262B','#4A5560','#E8E4DA'] };
const PTHEME_NAMES = { navy:'네이비', forest:'포레스트', plum:'플럼', sunset:'선셋', ink:'잉크' };
function autoPosterHTML(title, instructor, type, theme, h){
  const [a,b,pt] = PTHEMES[theme] || PTHEMES.navy;
  return `<div style="position:relative;height:${h||150}px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,${a},${b});display:flex;flex-direction:column;justify-content:center;padding:14px 18px">
    <div style="position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;background:${pt};opacity:.18"></div>
    <div style="position:absolute;right:22px;bottom:-36px;width:84px;height:84px;border-radius:50%;border:2px solid ${pt};opacity:.25"></div>
    <div style="font-size:10.5px;font-weight:800;letter-spacing:.14em;color:${pt}">${type==='joy'?'JOY CLASS · 조이클래스':'AFTER SCHOOL · 동아리'}</div>
    <div style="font-size:${(title||'').length>10?19:23}px;font-weight:900;color:#fff;line-height:1.25;margin-top:4px;word-break:keep-all">${esc(title||'동아리 이름')}</div>
    ${instructor?`<div style="font-size:11.5px;font-weight:700;color:${pt};margin-top:7px">강사 ${esc(instructor)}</div>`:''}
  </div>`;
}
function compressImg(file, maxW, q){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>{ const img = new Image();
      img.onload = ()=>{ const sc = Math.min(1, (maxW||720)/img.width);
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg', q||0.8)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
let POSTER = '', PTHEME = 'navy';
/* 💾 자동 임시저장 — 실수·오류·새로고침에도 입력이 날아가지 않게 */
let _draftT = null;
function draftKey(){ return `club_draft_${SEM?.id||'x'}_${EDIT?.id||'new'}`; }
function draftSave(){
  clearTimeout(_draftT);
  _draftT = setTimeout(()=>{
    try{
      const v = id => document.getElementById(id)?.value || '';
      localStorage.setItem(draftKey(), JSON.stringify({ t: Date.now(),
        type:TYPE, title:v('f-title'), intro:v('f-intro'), name:v('f-name'), co:v('f-co'), phone:v('f-phone'),
        min:v('f-min'), max:v('f-max'), place:v('f-place'), mat:v('f-mat'),
        from:v('f-from'), to:v('f-to'), start:v('f-start'), dur:v('f-dur'),
        gradeSel:[...document.querySelectorAll('.gsel input:checked')].map(i=>i.value), gnote:v('f-gnote'),
        answers:Object.fromEntries((SEM.questions||[]).map(q=>[q.id, v('q-'+q.id)])),
        poster:POSTER.length<400000?POSTER:'', posterTheme:PTHEME, sessions:SESSIONS }));
    }catch(e){}
  }, 800);
}
function draftLoad(){ try{ return JSON.parse(localStorage.getItem(draftKey())||'null'); }catch(e){ return null; } }
function draftClear(){ try{ localStorage.removeItem(draftKey()); }catch(e){} }
/* ✏️ 좁은 칸 확장 편집 — 더블클릭(폰: 길게 누르기)하면 큰 창에서 편하게 */
window.bigEdit = (el, label)=>{
  const bg = document.createElement('div'); bg.className='bigbg';
  bg.onclick = e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="bigbox">
    <div style="font-size:13.5px;font-weight:900;color:var(--pt);margin-bottom:8px">✏️ ${esc(label||'입력')}</div>
    <textarea id="big-ta">${esc(el.value||'')}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn line" onclick="this.closest('.bigbg').remove()">취소</button>
      <button class="btn" id="big-save">저장</button></div></div>`;
  document.body.appendChild(bg);
  const ta = bg.querySelector('#big-ta'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  bg.querySelector('#big-save').onclick = ()=>{
    el.value = ta.value.replace(/\n/g,' ').trim();
    el.dispatchEvent(new Event('input')); bg.remove();
  };
};
// 길게 누르기(모바일) — data-big 달린 입력에서 0.55초
(function(){
  let t=null, target=null;
  document.addEventListener('touchstart', e=>{
    const el = e.target.closest('input[data-big]'); if(!el) return;
    target = el; t = setTimeout(()=>{ bigEdit(el, el.dataset.big); }, 550);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev, ()=>{ clearTimeout(t); }, {passive:true}));
})();
function show(id){ document.querySelectorAll('.step').forEach(s=>s.classList.toggle('on', s.id===id)); }
const say = (id, cls, t) => { const m=$(id); m.className='alert '+cls; m.textContent=t; };

/* ── 로그인 ── */
window.setMode = (m)=>{ ['link','pw','staff'].forEach(k=>{ $('f-'+k).style.display = k===m?'':'none'; $('m-'+k).classList.toggle('on', k===m); }); };
window.sendLink = async ()=>{
  const email = $('l-email').value.trim(); if(!email) return say('l-msg','err','이메일을 입력해 주세요.');
  $('b-send').disabled = true;
  try{
    await sendSignInLinkToEmail(auth, email, { url: location.origin + location.pathname + (SEM_ID?'?sem='+SEM_ID:''), handleCodeInApp:true });
    localStorage.setItem(EMAIL_KEY, email);
    say('l-msg','ok',`${email} 로 로그인 링크를 보냈어요. 메일함(스팸함 포함)에서 링크를 눌러주세요.`);
  }catch(e){ $('b-send').disabled=false; say('l-msg','err','발송 실패: '+(e.code||e.message)); }
};
window.pwLogin = async ()=>{ try{ await signInWithEmailAndPassword(auth, $('p-email').value.trim(), $('p-pw').value); }catch(e){ say('l-msg','err','이메일 또는 비밀번호가 맞지 않아요. 잊으셨다면 이메일 링크로 로그인해 새로 만드세요.'); } };
window.staffLogin = async ()=>{ try{ await signInWithEmailAndPassword(auth, `${$('s-id').value.trim()}@gyosa-seongyosa.staff`, $('s-pw').value); }catch(e){ say('l-msg','err','아이디 또는 비밀번호를 확인해 주세요.'); } };
window.logout = async ()=>{ await signOut(auth); location.replace(location.pathname + (SEM_ID?'?sem='+SEM_ID:'')); };

(async function handleLink(){
  if(!isSignInWithEmailLink(auth, location.href)) return;
  show('st-verify');
  let email = localStorage.getItem(EMAIL_KEY);
  if(!email) email = prompt('확인을 위해 로그인 링크를 받은 이메일을 입력해 주세요.');
  try{ await signInWithEmailLink(auth, email, location.href); localStorage.removeItem(EMAIL_KEY);
    history.replaceState(null,'', location.pathname + (SEM_ID?'?sem='+SEM_ID:''));
  }catch(e){ show('st-login'); say('l-msg','err','링크 로그인에 실패했어요. 링크를 다시 받아주세요. ('+(e.code||'')+')'); }
})();

onAuthStateChanged(auth, async user=>{
  if(!user){ show('st-login'); return; }
  ME = user;
  try{ const st = await getDoc(doc(db,'staff',user.uid)); IS_STAFF = st.exists(); }catch(e){ IS_STAFF = false; }
  // 프로필 (교직원이면 이름 자동)
  const p = await getDoc(doc(db,'clubInstructors',user.uid));
  PROF = p.exists() ? p.data() : {};
  if(!PROF.name){ try{ const st = await getDoc(doc(db,'staff',user.uid)); if(st.exists()) PROF.name = st.data().name; }catch(e){} }
  if(!PROF.name){ try{ const pr = await getDoc(doc(db,'parents',user.uid)); if(pr.exists()) PROF.name = pr.data().name; }catch(e){} }
  $('me-name').textContent = PROF.name || '(이름 미입력)';
  $('me-email').textContent = user.email || '';
  await loadSem(); await loadMine();

/* ── 회차 자동 생성 ── */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;   // 로컬 날짜 (UTC 밀림 방지)
function sortG(arr){ return (arr||[]).slice().sort((a,b)=>{ const na=parseInt(a), nb=parseInt(b);
  if(!isNaN(na)&&!isNaN(nb)) return na-nb; if(!isNaN(na)) return -1; if(!isNaN(nb)) return 1; return String(a).localeCompare(String(b),'ko'); }); }
/* 옛 자유 텍스트에서 학년 추정: 목록 이름이 그대로 들어있거나 «4~6학년» 범위 표기면 펼쳐서 체크 */
function guessGrades(text, list){
  if(!text) return [];
  const out = new Set();
  list.forEach(g=>{ if(text.includes(g)) out.add(g); });
  const m = text.match(/(\d+)\s*[~\-–]\s*(\d+)\s*학년/);
  if(m){ const a=Number(m[1]), b=Number(m[2]);
    for(let n=Math.min(a,b); n<=Math.max(a,b); n++){ const g=`${n}학년`; if(list.includes(g)) out.add(g); } }
  return [...out];
}
function clampDate(v, lo, hi){ if(!v) return lo; return v<lo?lo:(v>hi?hi:v); }
function genSessions(weekdays, keepContent, from, to){
  const blocked = {}; (SEM.blocked||[]).forEach(b=>blocked[b.date]=b.reason||'운영 불가');
  const prev = {}; (keepContent||[]).forEach(s=>prev[s.date]=s);
  const f = clampDate(from, SEM.rangeFrom, SEM.rangeTo), t = clampDate(to||SEM.rangeTo, f, SEM.rangeTo);
  const out = [];
  let d = new Date(f+'T00:00:00'); const end = new Date(t+'T00:00:00');
  while(d<=end){
    if(weekdays.includes(d.getDay())){
      const ds = ymd(d), p = prev[ds]||{};
      if(blocked[ds]) out.push({ date:ds, blocked:true, reason:blocked[ds] });
      else out.push({ date:ds, blocked:false, skip:!!p.skip, skipReason:p.skipReason||'',
        ctitle:p.ctitle||'', content:p.content||'', materials:p.materials||'', cost:p.cost||'', note:p.note||'',
        sameAct:!!p.sameAct, matSame:!!p.matSame, sameCost:!!p.sameCost, sameNote:!!p.sameNote });
    }
    d.setDate(d.getDate()+1);
  }
  // ➕ 특별 회차(보강 등): 요일 패턴 밖 날짜 — 학기 범위 안이면 유지 (종료일 뒤 보강 포함)
  const have = new Set(out.map(x=>x.date));
  (keepContent||[]).forEach(p=>{
    if(!p.extra || have.has(p.date)) return;
    if(p.date < SEM.rangeFrom || p.date > SEM.rangeTo) return;
    out.push({ ...p, blocked:false });
  });
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return renumber(out);
}
function renumber(list){ let no=0; list.forEach(s=>{ if(!s.blocked && !s.skip){ no++; s.no=no; } else delete s.no; }); return list; }
const liveN = () => SESSIONS.filter(s=>!s.blocked && !s.skip).length;
function timeOptions(){
  const [h0,m0]=SEM.timeStart.split(':').map(Number), [h1,m1]=SEM.timeEnd.split(':').map(Number);
  const out=[]; for(let t=h0*60+m0; t<h1*60+m1; t+=10) out.push(`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);
  return out;
}
function maxDur(start){ const [h,m]=start.split(':').map(Number), [h1,m1]=SEM.timeEnd.split(':').map(Number); return Math.min(SEM.maxMin||120, (h1*60+m1)-(h*60+m)); }

  try{
    let d = await compressImg(f, 720, 0.8);
    if(d.length > 900000) d = await compressImg(f, 560, 0.72);
    if(d.length > 900000) return alert('사진이 너무 큽니다. 다른 사진으로 시도해 주세요.');
    POSTER = d; paintPoster();
  }catch(e){ alert('사진을 읽지 못했어요.'); }
};
window.delPoster = ()=>{ POSTER=''; const f=$('f-poster'); if(f) f.value=''; paintPoster(); };
let TYPE='club';
window.setType = (t, silent)=>{ TYPE=t; $('t-club').classList.toggle('on',t==='club'); $('t-joy').classList.toggle('on',t==='joy');
  document.querySelectorAll('.q').forEach(q=>{ const f=q.dataset.for; q.style.display = (f==='both'||f===t)?'':'none'; });
  if(!silent){ recalc(); if(!POSTER) paintPoster(); } };
window.durOptions = (sel)=>{ const s = $('f-start').value, mx = maxDur(s), cur = sel || Number($('f-dur').value)||60;
  $('f-dur').innerHTML = [30,40,50,60,70,80,90,100,110,120].filter(x=>x<=mx).map(x=>`<option value="${x}"${x===cur?' selected':''}>${x}분</option>`).join(''); };
function selWeekdays(){ return [...document.querySelectorAll('.wd input:checked')].map(i=>Number(i.value)); }
window.rebuildSessions = ()=>{ SESSIONS = genSessions(selWeekdays(), SESSIONS, $('f-from')?.value, $('f-to')?.value); renderSessions(); recalc(); draftSave(); };
window.toggleSkip = (i)=>{
  const s = SESSIONS[i]; if(!s || s.blocked) return;
  if(s.skip){ s.skip=false; s.skipReason=''; }
  else { const r = prompt('이 회차를 휴강으로 뺍니다. 사유(선택):', s.skipReason||''); if(r===null) return; s.skip=true; s.skipReason=r.trim(); }
  renumber(SESSIONS); renderSessions(); recalc(); draftSave();
};
function renderSessions(){
  const live = liveN(), schoolOff = SESSIONS.filter(s=>s.blocked).length, myOff = SESSIONS.filter(s=>s.skip).length;
  const dl = s => `${s.date.slice(5)} (${WD[new Date(s.date+'T00:00:00').getDay()]})`;
  const ed = isOpen();
  // 칸별 병합 그룹 — 휴강(학교·강사) 행이 끼면 그룹이 끊긴다
  const COLS = { act:'sameAct', mat:'matSame', cost:'sameCost', note:'sameNote' };
  const SP = {};
  for(const [col, flag] of Object.entries(COLS)){
    const sp = {}; let leader = -1;
    SESSIONS.forEach((x,i)=>{
      if(x.blocked || x.skip){ leader = -1; return; }
      if(leader>=0 && x[flag]){ sp[leader]++; }
      else { leader = i; sp[i] = 1; x[flag] = false; }
    });
    SP[col] = sp;
  }
  const mBtn = (i,col)=> ed && prevEditable(i)>=0
    ? `<button type="button" class="mgb" title="위 회차와 묶기" onclick="mergeCol(${i},'${col}')">〃</button>` : '';
  const foot = (i,col,n)=> n>1
    ? `<div class="mgf">〃 ${n}회 공통${ed?` · <a href="#" onclick="unmergeCol(${i},'${col}');return false">분리</a>`:''}</div>` : '';
  const cell = (i,col,inner,n)=> `<td rowspan="${n}" class="${n>1?'mgc':''}">${inner}${foot(i,col,n)}</td>`;
  const rows = SESSIONS.map((x,i)=>{
    if(x.blocked) return `<tr class="blocked"><td>—</td><td>${dl(x)}</td><td colspan="5">🚫 ${esc(x.reason)} — 학교 휴강</td></tr>`;
    if(x.skip) return `<tr class="blocked" style="background:#FFF7E6;color:#92400E"><td>—</td><td>${dl(x)}</td><td colspan="4">⏸ 강사 휴강${x.skipReason?' — '+esc(x.skipReason):''}</td><td>${ed?`<button type="button" class="btn line" style="padding:4px 8px;font-size:11px" onclick="toggleSkip(${i})">복원</button>`:''}</td></tr>`;
    let tds = '';
    if(SP.act[i]) tds += cell(i,'act', `<div class="cwrap">
        <input value="${esc(x.ctitle||'')}" placeholder="제목 (선택)" data-big="활동 제목 · ${dl(x)}" ondblclick="bigEdit(this,this.dataset.big)" oninput="updSess(${i},'ctitle',this)" ${ed?'':'disabled'} style="font-weight:800;color:#1D4ED8;margin-bottom:4px">
        <input value="${esc(x.content||'')}" placeholder="활동 내용" data-big="활동 내용 · ${dl(x)}" ondblclick="bigEdit(this,this.dataset.big)" oninput="updSess(${i},'content',this)" ${ed?'':'disabled'}>${mBtn(i,'act')}</div>`, SP.act[i]);
    if(SP.mat[i]) tds += cell(i,'mat', `<div class="cwrap"><input value="${esc(x.materials||'')}" data-big="준비물${SP.mat[i]>1?` · ${SP.mat[i]}회 공통`:` · ${dl(x)}`}" ondblclick="bigEdit(this,this.dataset.big)" oninput="updSess(${i},'materials',this)" ${ed?'':'disabled'}>${mBtn(i,'mat')}</div>`, SP.mat[i]);
    if(SP.cost[i]) tds += cell(i,'cost', `<div class="cwrap"><input value="${esc(x.cost||'')}" data-big="재료비 · ${dl(x)}" ondblclick="bigEdit(this,this.dataset.big)" oninput="updSess(${i},'cost',this)" ${ed?'':'disabled'}>${mBtn(i,'cost')}</div>`, SP.cost[i]);
    if(SP.note[i]) tds += cell(i,'note', `<div class="cwrap"><input value="${esc(x.note||'')}" data-big="비고 · ${dl(x)}" ondblclick="bigEdit(this,this.dataset.big)" oninput="updSess(${i},'note',this)" ${ed?'':'disabled'}>${mBtn(i,'note')}</div>`, SP.note[i]);
    const exTime = x.extra && (x.start || x.durMin)
      ? `<br><span style="font-size:10px;color:#6D28D9;font-weight:800">🕒 ${x.start||$('f-start')?.value||''} · ${x.durMin||Number($('f-dur')?.value)||0}분</span>` : '';
    const dayCell = x.extra
      ? `${dl(x)}<br><span style="display:inline-block;background:#EDE9FE;color:#6D28D9;border-radius:100px;padding:1px 7px;font-size:10px;font-weight:800">➕ ${esc(x.extraLabel||'보강')}</span>${exTime}`
      : dl(x);
    const btnCell = ed
      ? (x.extra ? `<button type="button" class="btn line" style="padding:4px 8px;font-size:11px" onclick="editExtra(${i})">✎</button> <button type="button" class="btn line" style="padding:4px 8px;font-size:11px;color:#B91C1C" onclick="delExtra(${i})">삭제</button>`
                 : `<button type="button" class="btn line" style="padding:4px 8px;font-size:11px" onclick="toggleSkip(${i})">휴강</button>`)
      : '';
    return `<tr>${x.extra?'<td style="background:#F6F2FF">':'<td>'}${x.no}</td><td ${x.extra?'style="background:#F6F2FF"':''}>${dayCell}</td>${tds}
      <td style="white-space:nowrap">${btnCell}</td></tr>`;
  }).join('');
  $('sess').innerHTML = SESSIONS.length ? `<div class="small">총 <b>${live}회</b> · 학교 휴강 ${schoolOff}일 · 강사 휴강 ${myOff}일 제외 — 칸 <b>더블클릭</b>(폰: 길게)=큰 창 · 각 칸의 <b>〃</b>=위 회차와 묶기</div>
    <div class="sess-scroll"><table class="tb tb-sess">
    <tr><th style="width:34px">회</th><th style="width:92px">수업일</th><th>활동 내용 <span style="font-weight:400">(제목+내용)</span></th><th style="width:150px">준비물</th><th style="width:96px">재료비</th><th style="width:130px">비고</th><th style="width:56px"></th></tr>
    ${rows}</table></div>
    ${ed?`<div class="row" style="margin-top:10px;background:#F6F2FF;border:1px solid #DDD3F5;border-radius:10px;padding:9px 12px">
      <b style="font-size:12.5px;color:#6D28D9">➕ 특별 회차 추가</b>
      <input type="date" id="ex-date" min="${SEM.rangeFrom}" max="${SEM.rangeTo}" style="width:150px;padding:8px 10px">
      <input type="text" id="ex-label" placeholder="이름 (예: 보강)" style="width:120px;padding:8px 10px">
      <select id="ex-start" style="width:auto;padding:8px 10px"><option value="">시간 동일</option>${wideTimes().map(t=>`<option>${t}</option>`).join('')}</select>
      <select id="ex-dur" style="width:auto;padding:8px 10px"><option value="">길이 동일</option>${[30,40,50,60,70,80,90,100,110,120,150,180].map(m=>`<option value="${m}">${m}분</option>`).join('')}</select>
      <button type="button" class="btn" style="padding:8px 14px;font-size:13px" onclick="addExtra()">추가</button>
      <span class="small">정한 요일·시간이 아니어도 됩니다 (예: 토 10:00 보강) — 회차·회비에 함께 셉니다.</span></div>`:''}` : '<div class="small">요일을 고르면 회차가 나타납니다.</div>';
}
function wideTimes(){ const out=[]; for(let t=8*60; t<=19*60+50; t+=10) out.push(`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`); return out; }
window.addExtra = ()=>{
  const ds = $('ex-date').value, label = ($('ex-label').value||'').trim() || '보강';
  const exStart = $('ex-start').value || '', exDur = Number($('ex-dur').value)||0;
  if(!ds) return alert('날짜를 골라주세요.');
  if(SESSIONS.some(x=>x.date===ds)) return alert('그 날짜에는 이미 회차(또는 휴강일)가 있어요.');
  const bk = (SEM.blocked||[]).find(b=>b.date===ds);
  if(bk && !confirm(`${ds}는 «${bk.reason||'운영 불가'}»로 학교 휴강일이에요.\n그래도 특별 회차로 넣을까요?`)) return;
  SESSIONS.push({ date:ds, extra:true, extraLabel:label, blocked:false, skip:false,
    ...(exStart?{start:exStart}:{}), ...(exDur?{durMin:exDur}:{}),
    ctitle:'', content:'', materials:'', cost:'', note:'', sameAct:false, matSame:false, sameCost:false, sameNote:false });
  SESSIONS.sort((a,b)=>a.date.localeCompare(b.date));
  renumber(SESSIONS); renderSessions(); recalc(); draftSave();
  $('ex-label').value='';
};
window.editExtra = (i)=>{
  const x = SESSIONS[i]; if(!x?.extra) return;
  const bg = document.createElement('div'); bg.className='bigbg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="bigbox">
    <div style="font-size:13.5px;font-weight:900;color:var(--pt);margin-bottom:10px">✎ ${x.date} 특별 회차</div>
    <label>이름</label><input id="ee-label" value="${esc(x.extraLabel||'보강')}">
    <div class="g2" style="margin-top:6px">
      <div><label>시작 시간</label><select id="ee-start"><option value="">동아리 시간과 동일</option>${wideTimes().map(t=>`<option${t===x.start?' selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>길이</label><select id="ee-dur"><option value="">동일</option>${[30,40,50,60,70,80,90,100,110,120,150,180].map(m=>`<option value="${m}"${m===x.durMin?' selected':''}>${m}분</option>`).join('')}</select></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn line" onclick="this.closest('.bigbg').remove()">취소</button>
      <button class="btn" id="ee-save">저장</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#ee-save').onclick = ()=>{
    x.extraLabel = (bg.querySelector('#ee-label').value||'').trim() || '보강';
    const st = bg.querySelector('#ee-start').value, du = Number(bg.querySelector('#ee-dur').value)||0;
    if(st) x.start = st; else delete x.start;
    if(du) x.durMin = du; else delete x.durMin;
    bg.remove(); renderSessions(); recalc(); draftSave();
  };
};
window.delExtra = (i)=>{
  const x = SESSIONS[i]; if(!x?.extra) return;
  if(!confirm(`${x.date} ${x.extraLabel||'보강'} 회차를 삭제할까요?`)) return;
  SESSIONS.splice(i,1); renumber(SESSIONS); renderSessions(); recalc(); draftSave();
};
window.mergeCol = (i,col)=>{ if(prevEditable(i)<0) return;
  const flag = {act:'sameAct',mat:'matSame',cost:'sameCost',note:'sameNote'}[col];
  SESSIONS[i][flag] = true; renderSessions(); draftSave(); };
window.unmergeCol = (leaderI,col)=>{
  const flag = {act:'sameAct',mat:'matSame',cost:'sameCost',note:'sameNote'}[col];
  let last = leaderI;
  for(let j=leaderI+1;j<SESSIONS.length;j++){ const x=SESSIONS[j]; if(x.blocked||x.skip) break; if(x[flag]) last=j; else break; }
  if(last>leaderI){ SESSIONS[last][flag] = false; renderSessions(); draftSave(); }
};
function prevEditable(i){ for(let j=i-1;j>=0;j--){ const x=SESSIONS[j]; if(x.blocked||x.skip) return -1; return j; } return -1; }
window.recalc = ()=>{
  const dur = Number($('f-dur')?.value||0), rate = TYPE==='joy' ? (SEM.feeJoy||0) : (SEM.feeClub||0);
  const per = Math.round(rate*dur/60);
  const lives = SESSIONS.filter(s=>!s.blocked && !s.skip);
  const sessFee = s => Math.round(rate * ((s.durMin||dur)) / 60);
  const total = lives.reduce((a,s)=>a+sessFee(s), 0);
  const exDiff = lives.filter(s=>s.extra && s.durMin && s.durMin!==dur);
  const exSum = exDiff.reduce((a,s)=>a+sessFee(s), 0);
  const regN = lives.length - exDiff.length;
  $('fee-box').innerHTML = `💰 1인 1회 <b>${per.toLocaleString()}원</b> (${rate.toLocaleString()}원/시간 × ${dur}분) · ${exDiff.length?`정규 ${regN}회 + 특별 ${exDiff.length}회(${exSum.toLocaleString()}원)`:`총 ${lives.length}회`} → <b>학기 1인 ${total.toLocaleString()}원</b>
    <div class="small">학생 ${Number($('f-min')?.value||0)}명 기준 강사료 ${(total*Number($('f-min')?.value||0)).toLocaleString()}원 ~ ${Number($('f-max')?.value||0)}명 ${(total*Number($('f-max')?.value||0)).toLocaleString()}원 (출석 기준 학기 말 정산)</div>`;
};
window.updSess = (i, k, el)=>{ if(SESSIONS[i]) SESSIONS[i][k] = el.value; draftSave(); };

window.saveApp = async (mode)=>{
  const v = id => ($(id)?.value||'').trim();
  const weekdays = selWeekdays();
  const draft = mode==='draft';
  if(!v('f-title')) return say('f-msg','err','프로그램 이름을 입력해 주세요.');
  if(!draft && !v('f-name')) return say('f-msg','err','강사 이름을 입력해 주세요.');
  if(!draft && !weekdays.length) return say('f-msg','err','요일을 하나 이상 골라주세요.');
  const gradeSel = sortG([...document.querySelectorAll('.gsel input:checked')].map(i=>i.value));
  if(!draft && SEM.gradeList && SEM.gradeList.length && !gradeSel.length) return say('f-msg','err','수강 대상 학년을 하나 이상 골라주세요.');
  const answers = {}; let missing = null;
  (SEM.questions||[]).forEach(q=>{ if(!(q.forType==='both'||q.forType===TYPE)) return; const val = v('q-'+q.id); answers[q.id]=val; if(q.required && !val && !missing) missing = q.label; });
  if(!draft && missing) return say('f-msg','err','필수 질문에 답해 주세요: '+missing);
  const adminFix0 = IS_STAFF && EDIT && EDIT.uid && EDIT.uid !== ME.uid;
  const rec = { semId:SEM.id, org:SEM.org, uid: adminFix0 ? EDIT.uid : ME.uid, email: adminFix0 ? (EDIT.email||'') : (ME.email||''), type:TYPE,
    instructorName:v('f-name'), coInstructors:v('f-co'), phone:v('f-phone'),
    title:v('f-title'), intro:v('f-intro'),
    gradeSel, gradeNote: v('f-gnote'), grades: gradeSel.length ? gradeSel.join('·') : v('f-grades'),
    poster: POSTER, posterTheme: PTHEME,
    minN:Number(v('f-min'))||0, maxN:Number(v('f-max'))||0,
    place:v('f-place'), materials:v('f-mat'), answers, weekdays, start:v('f-start'), durMin:Number(v('f-dur'))||60,
    startDate: v('f-from')||SEM.rangeFrom, endDate: v('f-to')||SEM.rangeTo,
    sessions: renumber(SESSIONS), sessionCount: liveN(), bank: { bank:PROF.bank||'', account:PROF.account||'', holder:PROF.holder||'' },
    updatedAt: Timestamp.now() };
  try{
    const adminFix = IS_STAFF && EDIT && EDIT.uid && EDIT.uid !== ME.uid;   // 관리자 대리 수정
    const newStatus = adminFix ? (EDIT.status||'submitted')
      : mode==='submit' ? 'submitted' : (mode==='draft' ? 'draft' : (EDIT?.status||'submitted'));
    if(EDIT) await updateDoc(doc(db,'clubApplications',EDIT.id), { ...rec, status:newStatus });
    else {
      const ref = await addDoc(collection(db,'clubApplications'), { ...rec, status:newStatus, published:false, createdAt:Timestamp.now() });
      EDIT = { id: ref.id, status:newStatus };   // 임시 저장 후 이어서 수정 가능
    }
    if(EDIT) EDIT.status = newStatus;
    // 프로필 이름·연락처 갱신 (내 신청서일 때만 — 관리자 대리 수정 시 내 프로필을 건드리지 않는다)
    if(!adminFix){
      await setDoc(doc(db,'clubInstructors',ME.uid), { name:rec.instructorName, phone:rec.phone, email:ME.email||'', updatedAt:Timestamp.now() }, { merge:true });
      PROF.name = rec.instructorName; PROF.phone = rec.phone; $('me-name').textContent = PROF.name;
    }
    draftClear();
    say('f-msg','ok', mode==='draft' ? '💾 임시 저장했습니다 — 언제든 이어서 쓰고, 준비되면 «최종 제출»을 눌러주세요.'
       : mode==='submit' ? '✅ 최종 제출했습니다! 마감 전까지는 수정할 수 있어요.'
       : '수정을 저장했습니다 ✓');
    await loadMine(); renderMine();
    if(mode==='submit'){ setTimeout(()=>{ $('form-area').innerHTML=''; window.scrollTo({top:0,behavior:'smooth'}); }, 1200); }
    if(!PROF.account) say('f-msg','info','제출 완료 ✓ — «내 정보·계좌»에서 강사료 입금 계좌도 등록해 주세요.');
  }catch(e){ say('f-msg','err','저장 실패: '+(e.code==='permission-denied'?'지금은 접수 기간이 아니거나 권한이 없습니다.':(e.message||''))); }
};

/* ── 내 정보 ── */
window.showProfile = ()=>{ $('pf-name').value=PROF.name||''; $('pf-phone').value=PROF.phone||''; $('pf-bank').value=PROF.bank||''; $('pf-acct').value=PROF.account||''; $('pf-holder').value=PROF.holder||''; $('pf-msg').className='alert'; show('st-profile'); };
window.showMain = ()=> show('st-main');
window.saveProfile = async ()=>{
  const p1=$('pf-pw1').value, p2=$('pf-pw2').value;
  try{
    const upd = { name:$('pf-name').value.trim(), phone:$('pf-phone').value.trim(), bank:$('pf-bank').value.trim(), account:$('pf-acct').value.trim(), holder:$('pf-holder').value.trim(), email:ME.email||'', updatedAt:Timestamp.now() };
    await setDoc(doc(db,'clubInstructors',ME.uid), upd, { merge:true });
    Object.assign(PROF, upd); $('me-name').textContent = PROF.name||'';
    if(p1||p2){
      if(p1.length<6) return say('pf-msg','err','비밀번호는 6자 이상이어야 해요.');
      if(p1!==p2) return say('pf-msg','err','비밀번호 두 칸이 서로 달라요.');
      try{ await updatePassword(auth.currentUser, p1); }
      catch(e){ return say('pf-msg','err', e.code==='auth/requires-recent-login' ? '보안을 위해 방금 로그인한 상태에서만 비밀번호를 만들 수 있어요 — 이메일 링크로 다시 로그인한 뒤 설정해 주세요.' : '비밀번호 설정 실패: '+(e.code||'')); }
      $('pf-pw1').value=''; $('pf-pw2').value='';
    }
    say('pf-msg','ok','저장했습니다 ✓');
  }catch(e){ say('pf-msg','err','저장 실패: '+(e.message||'')); }
};
</script>
