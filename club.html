<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 개설 신청 · 강사 포털</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="logo-daniel-color.png">
<style>
:root{--pt:#1E3932;--gold:#D8B45A;--cream:#FBFAF7;--ink:#22262B;--ink2:#5A5F66;--ink3:#8A8F98;--line:#E7E4DC;--wh:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.top{background:var(--pt);color:#fff;padding:22px 18px 18px;text-align:center}
.top h1{font-size:19px;font-weight:900}
.top p{font-size:12.5px;opacity:.8;margin-top:4px}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--wh);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:900;color:var(--pt);margin-bottom:10px}
label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--wh)}
textarea{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.btn{background:var(--pt);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:#1E3932}
.btn.line{background:var(--wh);color:var(--ink2);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert{display:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}.alert.err{display:block;background:#FDECEA;color:#C0392B}.alert.info{display:block;background:#EFF6FF;color:#1D4ED8}
.pill{display:inline-block;border-radius:100px;padding:3px 10px;font-size:10.5px;font-weight:800;background:#F1F0EC;color:#6B7280}
.pill.ok{background:#DCFCE7;color:#15803D}.pill.blue{background:#DBEAFE;color:#1D4ED8}.pill.warn{background:#FEF3C7;color:#B45309}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--wh);border-radius:10px;padding:11px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.seg button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.wd{display:flex;gap:6px}
.wd label{margin:0;flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 0;text-align:center;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink2)}
.wd input{display:none}
.wd label.on{background:var(--pt);border-color:var(--pt);color:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.tb th{background:#F3F1EA;color:var(--pt);padding:7px 6px;text-align:left;font-size:11.5px}
table.tb td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb td input{padding:6px 8px;font-size:12.5px;border-radius:7px}
tr.blocked td{background:#FEF2F2;color:#B91C1C;font-size:12px}
.fee{background:#FFF8E6;border:1px solid #F0DFAE;border-radius:12px;padding:12px 14px;font-size:13px}
.fee b{font-size:18px;color:var(--pt)}
.my{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:11.5px;color:var(--ink3)}
.step{display:none}.step.on{display:block}
</style>
</head>
<body>
<div class="top">
  <h1>🎨 방과후 동아리 · 조이클래스 개설 신청</h1>
  <p id="top-sub">이메일만 있으면 계정 없이 바로 작성할 수 있어요</p>
</div>
<div class="wrap">

  <!-- 로그인 -->
  <div class="step on" id="st-login">
    <div class="card">
      <h3>로그인</h3>
      <div class="seg" style="margin-bottom:12px">
        <button class="on" id="m-link" onclick="setMode('link')">✉️ 이메일 링크</button>
        <button id="m-pw" onclick="setMode('pw')">🔑 이메일+비밀번호</button>
        <button id="m-staff" onclick="setMode('staff')">🏫 교직원 아이디</button>
      </div>
      <div id="f-link">
        <label>이메일</label><input type="email" id="l-email" placeholder="예: teacher@naver.com" autocomplete="email">
        <div class="small" style="margin-top:6px">입력한 이메일로 로그인 링크를 보내드립니다. 링크를 누르면 로그인돼요. (처음이시면 이 방법으로)</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="b-send" onclick="sendLink()">로그인 링크 받기</button></div>
      </div>
      <div id="f-pw" style="display:none">
        <label>이메일</label><input type="email" id="p-email" autocomplete="email">
        <label>비밀번호</label><input type="password" id="p-pw" autocomplete="current-password">
        <div class="row" style="margin-top:10px"><button class="btn" onclick="pwLogin()">로그인</button></div>
        <div class="small" style="margin-top:6px">비밀번호는 처음 링크로 로그인한 뒤 «내 정보»에서 만들 수 있어요. 잊으셨다면 이메일 링크로 다시 로그인해 새로 만드세요.</div>
      </div>
      <div id="f-staff" style="display:none">
        <label>교사 선교사 아이디</label><input type="text" id="s-id" autocomplete="username">
        <label>비밀번호</label><input type="password" id="s-pw" autocomplete="current-password">
        <div class="row" style="margin-top:10px"><button class="btn" onclick="staffLogin()">로그인</button></div>
      </div>
      <div class="alert" id="l-msg"></div>
    </div>
  </div>

  <!-- 링크 처리 중 -->
  <div class="step" id="st-verify"><div class="card" style="text-align:center"><div style="font-size:30px">🔐</div><p id="v-label">로그인 확인 중…</p></div></div>

  <!-- 메인 -->
  <div class="step" id="st-main">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b id="me-name"></b> <span class="small" id="me-email"></span></div>
        <div class="row"><button class="btn line" onclick="showProfile()">👤 내 정보·계좌</button><button class="btn line" onclick="logout()">로그아웃</button></div>
      </div>
    </div>
    <div class="card" id="sem-card"></div>
    <div id="my-list"></div>
    <div id="form-area"></div>
  </div>

  <!-- 내 정보 -->
  <div class="step" id="st-profile">
    <div class="card"><h3>👤 내 정보</h3>
      <div class="g2">
        <div><label>이름</label><input id="pf-name"></div>
        <div><label>연락처</label><input id="pf-phone" placeholder="010-0000-0000"></div>
      </div>
      <h3 style="margin-top:14px">💳 입금 계좌 (강사료 정산용)</h3>
      <div class="g2">
        <div><label>은행</label><input id="pf-bank"></div>
        <div><label>계좌번호</label><input id="pf-acct"></div>
        <div><label>예금주</label><input id="pf-holder"></div>
      </div>
      <h3 style="margin-top:14px">🔑 비밀번호 만들기·변경 (선택)</h3>
      <div class="g2">
        <div><label>새 비밀번호 (6자 이상)</label><input type="password" id="pf-pw1" autocomplete="new-password"></div>
        <div><label>한 번 더</label><input type="password" id="pf-pw2" autocomplete="new-password"></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn" onclick="saveProfile()">저장</button><button class="btn line" onclick="showMain()">돌아가기</button></div>
      <div class="alert" id="pf-msg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink,
  signInWithEmailAndPassword, updatePassword, setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
await setPersistence(auth, browserLocalPersistence).catch(()=>{});

const $ = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const WD = ['일','월','화','수','목','금','토'];
const EMAIL_KEY = 'club_login_email';
const qs = new URLSearchParams(location.search);
const SEM_ID = qs.get('sem') || localStorage.getItem('club_sem') || '';
if(qs.get('sem')) localStorage.setItem('club_sem', qs.get('sem'));

let ME=null, PROF=null, SEM=null, MY=[], EDIT=null, SESSIONS=[];
function show(id){ document.querySelectorAll('.step').forEach(s=>s.classList.toggle('on', s.id===id)); }
const say = (id, cls, t) => { const m=$(id); m.className='alert '+cls; m.textContent=t; };

/* ── 로그인 ── */
window.setMode = (m)=>{ ['link','pw','staff'].forEach(k=>{ $('f-'+k).style.display = k===m?'':'none'; $('m-'+k).classList.toggle('on', k===m); }); };
window.sendLink = async ()=>{
  const email = $('l-email').value.trim(); if(!email) return say('l-msg','err','이메일을 입력해 주세요.');
  $('b-send').disabled = true;
  try{
    await sendSignInLinkToEmail(auth, email, { url: location.origin + location.pathname + (SEM_ID?'?sem='+SEM_ID:''), handleCodeInApp:true });
    localStorage.setItem(EMAIL_KEY, email);
    say('l-msg','ok',`${email} 로 로그인 링크를 보냈어요. 메일함(스팸함 포함)에서 링크를 눌러주세요.`);
  }catch(e){ $('b-send').disabled=false; say('l-msg','err','발송 실패: '+(e.code||e.message)); }
};
window.pwLogin = async ()=>{ try{ await signInWithEmailAndPassword(auth, $('p-email').value.trim(), $('p-pw').value); }catch(e){ say('l-msg','err','이메일 또는 비밀번호가 맞지 않아요. 잊으셨다면 이메일 링크로 로그인해 새로 만드세요.'); } };
window.staffLogin = async ()=>{ try{ await signInWithEmailAndPassword(auth, `${$('s-id').value.trim()}@gyosa-seongyosa.staff`, $('s-pw').value); }catch(e){ say('l-msg','err','아이디 또는 비밀번호를 확인해 주세요.'); } };
window.logout = async ()=>{ await signOut(auth); location.replace(location.pathname + (SEM_ID?'?sem='+SEM_ID:'')); };

(async function handleLink(){
  if(!isSignInWithEmailLink(auth, location.href)) return;
  show('st-verify');
  let email = localStorage.getItem(EMAIL_KEY);
  if(!email) email = prompt('확인을 위해 로그인 링크를 받은 이메일을 입력해 주세요.');
  try{ await signInWithEmailLink(auth, email, location.href); localStorage.removeItem(EMAIL_KEY);
    history.replaceState(null,'', location.pathname + (SEM_ID?'?sem='+SEM_ID:''));
  }catch(e){ show('st-login'); say('l-msg','err','링크 로그인에 실패했어요. 링크를 다시 받아주세요. ('+(e.code||'')+')'); }
})();

onAuthStateChanged(auth, async user=>{
  if(!user){ show('st-login'); return; }
  ME = user;
  // 프로필 (교직원이면 이름 자동)
  const p = await getDoc(doc(db,'clubInstructors',user.uid));
  PROF = p.exists() ? p.data() : {};
  if(!PROF.name){ try{ const st = await getDoc(doc(db,'staff',user.uid)); if(st.exists()) PROF.name = st.data().name; }catch(e){} }
  if(!PROF.name){ try{ const pr = await getDoc(doc(db,'parents',user.uid)); if(pr.exists()) PROF.name = pr.data().name; }catch(e){} }
  $('me-name').textContent = PROF.name || '(이름 미입력)';
  $('me-email').textContent = user.email || '';
  await loadSem(); await loadMine();
  show('st-main'); renderSemCard(); renderMine(); $('form-area').innerHTML='';
});

/* ── 학기 ── */
async function loadSem(){
  SEM = null;
  if(SEM_ID){ const d = await getDoc(doc(db,'clubSemesters',SEM_ID)); if(d.exists()) SEM = {id:d.id, ...d.data()}; }
  if(!SEM){ // 모집중인 학기 아무거나
    const snap = await getDocs(query(collection(db,'clubSemesters'), where('status','==','recruiting')));
    if(!snap.empty){ const d = snap.docs[0]; SEM = {id:d.id, ...d.data()}; localStorage.setItem('club_sem', d.id); }
  }
}
function isOpen(){ return SEM && (SEM.status==='recruiting' || SEM.status==='planning'); }   // 수정 가능
function canCreate(){ return SEM && SEM.status==='recruiting'; }                                // 새 신청서
function ms(role){ return (SEM?.milestones||[]).find(m=>m.role===role) || null; }
function leftText(at){ if(!at) return ''; const left = new Date(at) - Date.now();
  if(left<0) return '지남'; const d=Math.floor(left/86400000), h=Math.floor(left%86400000/3600000); return `${d?d+'일 ':''}${h}시간 남음`; }
function scheduleHTML(){
  const list = (SEM.milestones||[]).filter(m=>m.at);
  if(!list.length) return '';
  return `<div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px">${list.map(m=>{
    const past = new Date(m.at) < Date.now();
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;${past?'opacity:.55':''}"><b>${esc(m.label)}</b><br>${m.at.replace('T',' ')} <span class="small">· ${leftText(m.at)}</span></div>`; }).join('')}</div>`;
}
function renderSemCard(){
  if(!SEM){ $('sem-card').innerHTML = `<h3>지금 모집 중인 학기가 없어요</h3><div class="small">학교에서 보내드린 링크로 다시 들어오시거나, 모집 시작을 기다려 주세요.</div>`; return; }
  const stLabel = SEM.status==='recruiting' ? '강사 모집중' : SEM.status==='planning' ? '활동 계획서 제출중 (수정만 가능)' : '접수 마감';
  $('sem-card').innerHTML = `<div class="row" style="justify-content:space-between">
    <div><div style="font-size:15px;font-weight:900;color:var(--pt)">${esc(ORGS[SEM.org]||'')} · ${esc(SEM.name)}</div>
      <div class="small">수업 ${SEM.timeStart}~${SEM.timeEnd} (최대 ${SEM.maxMin}분) · 학기 ${SEM.rangeFrom} ~ ${SEM.rangeTo}</div></div>
    <span class="pill ${canCreate()?'ok':isOpen()?'blue':'warn'}">${stLabel}</span></div>
    ${scheduleHTML()}
    <div class="row" style="margin-top:10px">${canCreate()?`<button class="btn gold" onclick="newApp()">＋ 새 개설 신청서 쓰기</button>`
      : isOpen() ? '<span class="small">새 신청은 마감됐어요. 제출한 신청서의 활동 계획은 «계획서 제출 마감»까지 수정할 수 있습니다.</span>'
      : '<span class="small">지금은 신청서를 새로 쓰거나 고칠 수 없어요.</span>'}</div>`;
}

/* ── 내 신청서 ── */
async function loadMine(){
  MY = [];
  if(!ME) return;
  const snap = await getDocs(query(collection(db,'clubApplications'), where('uid','==',ME.uid)));
  MY = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
}
const AST = { submitted:'접수됨', approved:'승인', hold:'보류', rejected:'반려' };
function renderMine(){
  const list = SEM ? MY.filter(a=>a.semId===SEM.id) : MY;
  $('my-list').innerHTML = list.length ? `<div class="card"><h3>내 신청서</h3>${list.map(a=>`<div class="my">
    <div><span class="pill ${a.type==='joy'?'blue':'ok'}">${a.type==='joy'?'조이클래스':'동아리'}</span> <b>${esc(a.title||'')}</b>
      <div class="small">${(a.weekdays||[]).map(w=>WD[w]).join('·')} ${a.start||''} · ${a.durMin||0}분 · ${(a.sessions||[]).filter(s=>!s.blocked).length}회 · <span class="pill">${AST[a.status]||a.status}</span></div></div>
    <div class="row">${isOpen()?`<button class="btn line" onclick="editApp('${a.id}')">수정</button>`:`<button class="btn line" onclick="editApp('${a.id}')">보기</button>`}</div></div>`).join('')}</div>` : '';
}

/* ── 회차 자동 생성 ── */
function genSessions(weekdays, keepContent){
  const blocked = {}; (SEM.blocked||[]).forEach(b=>blocked[b.date]=b.reason||'운영 불가');
  const prev = {}; (keepContent||[]).forEach(s=>prev[s.date]=s);
  const out = []; let no = 0;
  let d = new Date(SEM.rangeFrom+'T00:00:00'); const end = new Date(SEM.rangeTo+'T00:00:00');
  while(d<=end){
    const wd = d.getDay();
    if(weekdays.includes(wd)){
      const ds = d.toISOString().slice(0,10);
      if(blocked[ds]) out.push({ date:ds, blocked:true, reason:blocked[ds] });
      else { no++; out.push({ date:ds, no, blocked:false, content:prev[ds]?.content||'', materials:prev[ds]?.materials||'', cost:prev[ds]?.cost||'' }); }
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}
function timeOptions(){
  const [h0,m0]=SEM.timeStart.split(':').map(Number), [h1,m1]=SEM.timeEnd.split(':').map(Number);
  const out=[]; for(let t=h0*60+m0; t<h1*60+m1; t+=10) out.push(`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);
  return out;
}
function maxDur(start){ const [h,m]=start.split(':').map(Number), [h1,m1]=SEM.timeEnd.split(':').map(Number); return Math.min(SEM.maxMin||120, (h1*60+m1)-(h*60+m)); }

/* ── 신청서 폼 ── */
window.newApp = ()=>{ EDIT=null; SESSIONS=[]; renderForm({ type:'club', instructorName:PROF.name||'', phone:PROF.phone||'', weekdays:[], start:SEM.timeStart, durMin:60 }); };
window.editApp = (id)=>{ const a = MY.find(x=>x.id===id); if(!a) return; EDIT=a; SESSIONS=(a.sessions||[]).map(s=>({...s})); renderForm(a); };
function renderForm(a){
  const ro = !isOpen();
  const qsAll = SEM.questions||[];
  $('form-area').innerHTML = `<div class="card" id="form">
    <h3>${EDIT?'신청서 '+(ro?'보기':'수정'):'새 개설 신청서'}</h3>
    <label>구분</label>
    <div class="seg"><button id="t-club" class="${a.type!=='joy'?'on':''}" onclick="setType('club')" ${ro?'disabled':''}>동아리 (성인 강사)</button><button id="t-joy" class="${a.type==='joy'?'on':''}" onclick="setType('joy')" ${ro?'disabled':''}>조이클래스 (DA 중·고 학생 강사)</button></div>
    <div class="g2">
      <div><label>강사 이름</label><input id="f-name" value="${esc(a.instructorName||'')}"></div>
      <div><label>공동 강사 (있으면)</label><input id="f-co" value="${esc(a.coInstructors||'')}" placeholder="예: 허예주"></div>
      <div><label>연락처</label><input id="f-phone" value="${esc(a.phone||'')}"></div>
      <div><label>이메일</label><input value="${esc(ME.email||'')}" disabled></div>
    </div>
    <label>프로그램(동아리) 이름</label><input id="f-title" value="${esc(a.title||'')}" placeholder="예: 워십댄스 동아리">
    <label>한 줄 소개</label><input id="f-intro" value="${esc(a.intro||'')}" placeholder="예: 찬양에 맞추어 춤으로 예배합니다">
    <div class="g2">
      <div><label>수강 대상 (학년·반)</label><input id="f-grades" value="${esc(a.grades||'')}" placeholder="예: 4~6학년 / 로이반"></div>
      <div><label>최소 인원</label><input type="number" id="f-min" value="${a.minN||3}"></div>
      <div><label>최대 인원</label><input type="number" id="f-max" value="${a.maxN||10}"></div>
      <div><label>희망 장소</label><input id="f-place" value="${esc(a.place||'')}" placeholder="미정이면 비워두세요"></div>
    </div>
    <label>준비물</label><input id="f-mat" value="${esc(a.materials||'')}">
    ${qsAll.map(q=>`<div class="q" data-for="${q.forType}"><label>${esc(q.label)}${q.required?' <span style="color:#C0392B">*</span>':''}</label>
      ${q.type==='long'?`<textarea id="q-${q.id}">${esc((a.answers||{})[q.id]||'')}</textarea>`:`<input id="q-${q.id}" value="${esc((a.answers||{})[q.id]||'')}">`}</div>`).join('')}

    <h3 style="margin-top:16px">🗓 요일 · 시간</h3>
    <div class="wd">${[1,2,3,4,5].map(w=>`<label class="${(a.weekdays||[]).includes(w)?'on':''}"><input type="checkbox" value="${w}" ${(a.weekdays||[]).includes(w)?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked); rebuildSessions()">${WD[w]}</label>`).join('')}</div>
    <div class="g2">
      <div><label>시작 시간</label><select id="f-start" onchange="durOptions(); recalc()">${timeOptions().map(t=>`<option${t===(a.start||SEM.timeStart)?' selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>수업 길이</label><select id="f-dur" onchange="recalc()"></select></div>
    </div>
    <div class="small" style="margin-top:4px">${SEM.timeStart}부터 가능, ${SEM.timeEnd}까지 · 최대 ${SEM.maxMin}분</div>
    <div class="fee" id="fee-box" style="margin-top:10px"></div>

    <h3 style="margin-top:16px">📋 수업 활동 계획 <span class="small">(요일을 고르면 학기 회차가 자동으로 만들어져요 · 불가 일정은 자동 제외)</span></h3>
    <div id="sess"></div>

    <div class="row" style="margin-top:16px">${ro?'':`<button class="btn gold" onclick="saveApp()">${EDIT?'수정 저장':'신청서 제출'}</button>`}<button class="btn line" onclick="document.getElementById('form-area').innerHTML=''">닫기</button></div>
    <div class="alert" id="f-msg"></div>
  </div>`;
  setType(a.type||'club', true);
  durOptions(a.durMin||60);
  if(!SESSIONS.length && (a.weekdays||[]).length) SESSIONS = genSessions(a.weekdays, a.sessions||[]);
  renderSessions(); recalc();
  $('form').scrollIntoView({behavior:'smooth'});
}
let TYPE='club';
window.setType = (t, silent)=>{ TYPE=t; $('t-club').classList.toggle('on',t==='club'); $('t-joy').classList.toggle('on',t==='joy');
  document.querySelectorAll('.q').forEach(q=>{ const f=q.dataset.for; q.style.display = (f==='both'||f===t)?'':'none'; }); if(!silent) recalc(); };
window.durOptions = (sel)=>{ const s = $('f-start').value, mx = maxDur(s), cur = sel || Number($('f-dur').value)||60;
  $('f-dur').innerHTML = [30,40,50,60,70,80,90,100,110,120].filter(x=>x<=mx).map(x=>`<option value="${x}"${x===cur?' selected':''}>${x}분</option>`).join(''); };
function selWeekdays(){ return [...document.querySelectorAll('.wd input:checked')].map(i=>Number(i.value)); }
window.rebuildSessions = ()=>{ SESSIONS = genSessions(selWeekdays(), SESSIONS); renderSessions(); recalc(); };
function renderSessions(){
  const live = SESSIONS.filter(s=>!s.blocked).length;
  $('sess').innerHTML = SESSIONS.length ? `<div class="small">총 ${live}회 (휴강 ${SESSIONS.length-live}일 제외)</div>
    <table class="tb"><tr><th style="width:34px">회</th><th style="width:96px">수업일</th><th>활동 내용</th><th style="width:110px">준비물</th><th style="width:70px">재료비</th></tr>
    ${SESSIONS.map((s,i)=> s.blocked
      ? `<tr class="blocked"><td>—</td><td>${s.date.slice(5)} (${WD[new Date(s.date+'T00:00:00').getDay()]})</td><td colspan="3">🚫 ${esc(s.reason)} — 휴강</td></tr>`
      : `<tr><td>${s.no}</td><td>${s.date.slice(5)} (${WD[new Date(s.date+'T00:00:00').getDay()]})</td>
         <td><input data-i="${i}" data-k="content" value="${esc(s.content||'')}" oninput="SESSIONS[${i}].content=this.value" ${isOpen()?'':'disabled'}></td>
         <td><input data-i="${i}" data-k="materials" value="${esc(s.materials||'')}" oninput="SESSIONS[${i}].materials=this.value" ${isOpen()?'':'disabled'}></td>
         <td><input data-i="${i}" data-k="cost" value="${esc(s.cost||'')}" oninput="SESSIONS[${i}].cost=this.value" ${isOpen()?'':'disabled'}></td></tr>`).join('')}
    </table>` : '<div class="small">요일을 고르면 회차가 나타납니다.</div>';
}
window.recalc = ()=>{
  const dur = Number($('f-dur')?.value||0), rate = TYPE==='joy' ? (SEM.feeJoy||0) : (SEM.feeClub||0);
  const per = Math.round(rate*dur/60), live = SESSIONS.filter(s=>!s.blocked).length;
  $('fee-box').innerHTML = `💰 1인 1회 <b>${per.toLocaleString()}원</b> (${rate.toLocaleString()}원/시간 × ${dur}분) · 총 ${live}회 → <b>학기 1인 ${(per*live).toLocaleString()}원</b>
    <div class="small">학생 ${Number($('f-min')?.value||0)}명 기준 강사료 ${(per*live*Number($('f-min')?.value||0)).toLocaleString()}원 ~ ${Number($('f-max')?.value||0)}명 ${(per*live*Number($('f-max')?.value||0)).toLocaleString()}원 (출석 기준 학기 말 정산)</div>`;
};
window.SESSIONS = SESSIONS;

window.saveApp = async ()=>{
  const v = id => ($(id)?.value||'').trim();
  const weekdays = selWeekdays();
  if(!v('f-name')) return say('f-msg','err','강사 이름을 입력해 주세요.');
  if(!v('f-title')) return say('f-msg','err','프로그램 이름을 입력해 주세요.');
  if(!weekdays.length) return say('f-msg','err','요일을 하나 이상 골라주세요.');
  const answers = {}; let missing = null;
  (SEM.questions||[]).forEach(q=>{ if(!(q.forType==='both'||q.forType===TYPE)) return; const val = v('q-'+q.id); answers[q.id]=val; if(q.required && !val && !missing) missing = q.label; });
  if(missing) return say('f-msg','err','필수 질문에 답해 주세요: '+missing);
  const rec = { semId:SEM.id, org:SEM.org, uid:ME.uid, email:ME.email||'', type:TYPE,
    instructorName:v('f-name'), coInstructors:v('f-co'), phone:v('f-phone'),
    title:v('f-title'), intro:v('f-intro'), grades:v('f-grades'), minN:Number(v('f-min'))||0, maxN:Number(v('f-max'))||0,
    place:v('f-place'), materials:v('f-mat'), answers, weekdays, start:v('f-start'), durMin:Number(v('f-dur'))||60,
    sessions: SESSIONS, bank: { bank:PROF.bank||'', account:PROF.account||'', holder:PROF.holder||'' },
    updatedAt: Timestamp.now() };
  try{
    if(EDIT) await updateDoc(doc(db,'clubApplications',EDIT.id), rec);
    else await addDoc(collection(db,'clubApplications'), { ...rec, status:'submitted', published:false, createdAt:Timestamp.now() });
    // 프로필 이름·연락처 갱신
    await setDoc(doc(db,'clubInstructors',ME.uid), { name:rec.instructorName, phone:rec.phone, email:ME.email||'', updatedAt:Timestamp.now() }, { merge:true });
    PROF.name = rec.instructorName; PROF.phone = rec.phone; $('me-name').textContent = PROF.name;
    say('f-msg','ok', EDIT ? '수정을 저장했습니다 ✓' : '신청서를 제출했습니다 ✓ 마감 전까지 언제든 수정할 수 있어요.');
    await loadMine(); renderMine();
    if(!EDIT){ setTimeout(()=>{ $('form-area').innerHTML=''; window.scrollTo({top:0,behavior:'smooth'}); }, 1200); }
    if(!PROF.account) say('f-msg','info','제출 완료 ✓ — «내 정보·계좌»에서 강사료 입금 계좌도 등록해 주세요.');
  }catch(e){ say('f-msg','err','저장 실패: '+(e.code==='permission-denied'?'지금은 접수 기간이 아니거나 권한이 없습니다.':(e.message||''))); }
};

/* ── 내 정보 ── */
window.showProfile = ()=>{ $('pf-name').value=PROF.name||''; $('pf-phone').value=PROF.phone||''; $('pf-bank').value=PROF.bank||''; $('pf-acct').value=PROF.account||''; $('pf-holder').value=PROF.holder||''; $('pf-msg').className='alert'; show('st-profile'); };
window.showMain = ()=> show('st-main');
window.saveProfile = async ()=>{
  const p1=$('pf-pw1').value, p2=$('pf-pw2').value;
  try{
    const upd = { name:$('pf-name').value.trim(), phone:$('pf-phone').value.trim(), bank:$('pf-bank').value.trim(), account:$('pf-acct').value.trim(), holder:$('pf-holder').value.trim(), email:ME.email||'', updatedAt:Timestamp.now() };
    await setDoc(doc(db,'clubInstructors',ME.uid), upd, { merge:true });
    Object.assign(PROF, upd); $('me-name').textContent = PROF.name||'';
    if(p1||p2){
      if(p1.length<6) return say('pf-msg','err','비밀번호는 6자 이상이어야 해요.');
      if(p1!==p2) return say('pf-msg','err','비밀번호 두 칸이 서로 달라요.');
      try{ await updatePassword(auth.currentUser, p1); }
      catch(e){ return say('pf-msg','err', e.code==='auth/requires-recent-login' ? '보안을 위해 방금 로그인한 상태에서만 비밀번호를 만들 수 있어요 — 이메일 링크로 다시 로그인한 뒤 설정해 주세요.' : '비밀번호 설정 실패: '+(e.code||'')); }
      $('pf-pw1').value=''; $('pf-pw2').value='';
    }
    say('pf-msg','ok','저장했습니다 ✓');
  }catch(e){ say('pf-msg','err','저장 실패: '+(e.message||'')); }
};
</script>
</body>
