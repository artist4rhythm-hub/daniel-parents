<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 홈</title>
<style>body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#F7F5EF;
  min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8A8F98;font-size:13px}</style>
</head>
<body>
<div id="m">내 기관 홈으로 이동하는 중…</div>
<script type="module">
// 옛 링크(home.html)로 들어와도 자녀의 기관 홈으로 자동 이동한다.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, collection, query, where, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
onAuthStateChanged(auth, async user=>{
  let po=null; try{ po=localStorage.getItem('parent_org'); }catch(e){}
  if(!user){
    location.replace(po==='jihyebit'?'login-jihyebit.html':po==='daniel'?'login-daniel.html':'index.html');
    return;
  }
  try{
    const snap = await getDocs(query(collection(db,'parentLinks'),
      where('parentUid','==',user.uid), where('status','==','active')));
    const orgs=[...new Set([...snap.docs].map(d=>d.data().org||'daniel'))];
    if(!orgs.length){ location.replace(po==='jihyebit'?'login-jihyebit.html':po==='daniel'?'login-daniel.html':'index.html'); return; }
    const go = (po && orgs.includes(po)) ? po : orgs[0];
    location.replace('home-'+go+'.html');
  }catch(e){ document.getElementById('m').textContent='이동하지 못했습니다: '+(e.message||''); }
});
</script>
</body>
</html>
