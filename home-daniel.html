<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>다니엘 아마츠 학부모</title>
<meta name="theme-color" content="#0C2A44">
<link rel="icon" type="image/png" href="logo-daniel-color.png">
<link rel="manifest" href="manifest-daniel.json">
<link rel="apple-touch-icon" href="logo-daniel-color.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다니엘 아마츠 학부모">
<style>
:root{
  --hero:#0C2A44; --hero-sub:#9FB3C8; --tile:#173A5C;
  --acc-bg:#D8B45A; --acc-tx:#0C2A44;
  --pt:#0C2A44; --cream:#F7F5EF; --card:#fff; --line:#E4E0D5;
  --ink:#1E2530; --ink2:#57534A; --ink3:#8A8F98; --dot:#D85A30;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--cream);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* ── 히어로 ── */
.hero{background:var(--hero);padding:20px 18px 16px;border-radius:0 0 22px 22px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-org{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hero-sub);letter-spacing:.03em;font-weight:600}
.hero-org img{width:22px;height:22px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.hero-me{width:34px;height:34px;border-radius:50%;background:var(--tile);border:none;color:#fff;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hero h1{font-size:19px;font-weight:800;color:#fff;margin-top:12px;letter-spacing:-.01em}
.hero .kidsline{font-size:11.5px;color:var(--hero-sub);margin-top:4px}
.newsbar{margin-top:13px;background:var(--acc-bg);border-radius:12px;padding:11px 13px;width:100%;
  display:flex;justify-content:space-between;align-items:center;border:none;cursor:pointer;font-family:inherit;text-align:left}
.newsbar b{font-size:12.5px;color:var(--acc-tx);font-weight:800}
.newsbar span{font-size:13px;color:var(--acc-tx)}
.newsbar.quiet{background:rgba(255,255,255,.12)}
.newsbar.quiet b, .newsbar.quiet span{color:var(--hero-sub)}
.quick{display:flex;gap:7px;margin-top:10px}
.quick a{flex:1;background:var(--tile);border-radius:11px;padding:9px 4px;text-align:center;color:#fff}
.quick a .qi{font-size:16px;display:block}
.quick a .qt{font-size:10px;margin-top:3px;display:block;opacity:.88;font-weight:600}
/* ── 새 소식 펼침 ── */
.newslist{display:none;margin-top:9px;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 2px}
.newslist.show{display:block}
.newslist a{display:flex;gap:8px;align-items:baseline;padding:8px 11px;font-size:12px;color:#fff;border-radius:9px}
.newslist a:active{background:rgba(255,255,255,.12)}
.newslist small{color:var(--hero-sub);font-size:10px;margin-left:auto;white-space:nowrap}
/* ── 본문 카드 ── */
.main{padding:12px 12px 30px;display:flex;flex-direction:column;gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.card-h b{font-size:13px;font-weight:800;color:var(--pt)}
.card-h a{font-size:11px;color:var(--ink3);font-weight:600}
.item{display:block;padding:7px 0;border-top:1px solid #F0EDE5}
.item:first-of-type{border-top:none;padding-top:0}
.item .t{font-size:13px;font-weight:700;color:var(--ink);line-height:1.45}
.item.read .t{color:#5A5F66;font-weight:600}
.item .m{font-size:10.5px;color:var(--ink3);margin-top:2px}
.dot{color:var(--dot);font-size:11px;margin-left:3px}
.empty-line{font-size:12px;color:var(--ink3);padding:4px 0}
/* 더 보기 그리드 */
.more{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.more a,.more .off{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.more .mt{font-size:12.5px;font-weight:800;color:var(--ink)}
.more .md{font-size:10px;color:var(--ink3);margin-top:3px;line-height:1.45}
.more .off{opacity:.55}
/* 내 정보 */
.me-sec .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #F0EDE5;font-size:13px}
.me-sec .row:first-of-type{border-top:none;padding-top:0}
.me-sec .row small{color:var(--ink3);font-size:11px}
.kid{display:inline-flex;align-items:center;gap:4px;background:var(--cream);border:1px solid var(--line);
  border-radius:100px;padding:5px 11px;font-size:12px;font-weight:700;margin:3px 4px 0 0}
.kid small{font-weight:500;color:var(--ink2)}
.kid-add{display:inline-block;border:1.5px dashed var(--line);border-radius:100px;padding:5px 11px;
  font-size:12px;color:var(--ink3);margin-top:3px;font-weight:600}
.btnline{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;
  font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.cross{font-size:11px;color:#B0AA9C;text-align:center;padding:6px 0 0;display:none}
.cross a{color:#5E4B8B;font-weight:700}
.alert{display:none;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;margin-top:8px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}
.alert.err{display:block;background:#FDECEA;color:#C0392B}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;font-family:inherit;outline:none}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px}
/* ── 반응형: 패드·컴퓨터 ── */
@media (min-width:760px){
  .wrap{max-width:960px}
  .hero{border-radius:0 0 26px 26px;padding:26px 28px 20px}
  .hero h1{font-size:23px}
  .newsbar{max-width:560px}
  .quick{max-width:560px}
  .main{padding:16px 20px 40px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .main .card{margin:0}
  #name-card{grid-column:1 / -1}
  .more{grid-column:1 / -1;grid-template-columns:repeat(4,1fr)}
  .me-sec{grid-column:1 / -1}
}
@media (min-width:1200px){ .wrap{max-width:1080px} }
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div class="wrap" id="main" style="display:none">

<div class="hero">
  <div class="hero-top">
    <div class="hero-org"><img src="logo-daniel-color.png" onerror="this.style.display='none'">다니엘 아마츠</div>
    <button class="hero-me" onclick="document.getElementById('me-sec').scrollIntoView({behavior:'smooth'})" title="내 정보">👤</button>
  </div>
  <h1 id="greet">안녕하세요</h1>
  <div class="kidsline" id="kidsline"></div>
  <button class="newsbar" id="newsbar" onclick="toggleNews()">
    <b id="news-t">🔔 새 소식을 확인하는 중…</b><span>→</span>
  </button>
  <div class="newslist" id="newslist"></div>
  <div class="quick">
    <a id="q-fam" href="#"><span class="qi">📨</span><span class="qt">통신문</span></a>
    <a id="q-board" href="#"><span class="qi">💬</span><span class="qt">게시판</span></a>
    <a id="q-cal" href="#"><span class="qi">📅</span><span class="qt">일정</span></a>
  </div>
</div>

<div class="main">
  <div class="card" id="name-card" style="display:none">
    <div class="card-h"><b>👋 처음 오셨네요</b></div>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:8px">게시판에서 쓸 보호자 성함을 알려주세요. (예: 김은혜)</div>
    <div style="display:flex;gap:7px">
      <input type="text" id="p-name" placeholder="보호자 성함" maxlength="10">
      <button class="btnline" style="white-space:nowrap;color:var(--pt)" onclick="saveName()">저장</button>
    </div>
    <div class="alert" id="name-msg"></div>
  </div>

  <div class="card">
    <div class="card-h"><b>📨 가정통신문</b><a id="fam-all" href="#">전체 보기 →</a></div>
    <div id="fam-list"><div class="empty-line">불러오는 중…</div></div>
  </div>

  <div class="card">
    <div class="card-h"><b id="board-title">💬 우리 반 게시판</b><a id="board-all" href="#">더 보기 →</a></div>
    <div id="board-list"><div class="empty-line">불러오는 중…</div></div>
  </div>

  <div class="more" id="more"></div>

  <div class="card me-sec" id="me-sec">
    <div class="card-h"><b>👤 내 정보</b></div>
    <div class="row"><span id="me-name">보호자</span>
      <span style="display:flex;gap:8px;align-items:center"><small id="me-email"></small>
        <button class="btnline" style="padding:5px 10px;font-size:11px" onclick="openMeEdit()">수정</button></span></div>
    <div class="row" id="me-edit" style="display:none;flex-direction:column;align-items:stretch;gap:7px">
      <input type="text" id="me-name-in" placeholder="보호자 성함 (예: 김은혜)" maxlength="10">
      <div style="display:flex;gap:5px;flex-wrap:wrap" id="rel-chips"></div>
      <div style="border-top:1px solid #F0EDE5;padding-top:8px">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
          <span id="av-preview"></span>
          <small style="color:var(--ink3)">프로필 — 이모지를 고르거나 사진을 올려 보세요</small>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px" id="av-emojis"></div>
        <div style="display:flex;gap:7px;align-items:center">
          <label class="btnline" style="cursor:pointer">📷 사진 올리기
            <input type="file" id="av-file" accept="image/*" style="display:none"></label>
          <button class="btnline" onclick="clearAvatar()">기본으로</button>
        </div>
      </div>
      <div style="display:flex;gap:7px;justify-content:flex-end">
        <button class="btnline" onclick="document.getElementById('me-edit').style.display='none'">취소</button>
        <button class="btnline" style="color:var(--pt);border-color:var(--pt)" onclick="saveMe()">저장</button>
      </div>
      <div class="alert" id="me-msg"></div>
    </div>
    <div class="row" style="display:block">
      <small>연결된 자녀</small>
      <div id="kids" style="margin-top:4px"></div>
    </div>
    <div class="row"><span style="font-size:12.5px;color:var(--ink2)">📲 홈 화면에 앱으로 설치하면 더 빨라요</span>
      <small>공유 → 홈 화면에 추가</small></div>
    <div class="row" id="push-row" style="display:none">
      <span style="font-size:12.5px;color:var(--ink2)">🔔 새 통신문·공지 알림 받기</span>
      <button class="btnline" id="push-btn" onclick="enablePush()">알림 켜기</button></div>
    <div class="row"><button class="btnline" onclick="logout()">로그아웃</button></div>
    <div class="cross" id="cross">지혜빛 선교원 자녀가 있으신가요? <a href="home-jihyebit.html">지혜빛 사이트 열기 →</a></div>
  </div>
</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, arrayUnion, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
setPersistence(auth, browserLocalPersistence).catch(()=>{});

const ORG = 'daniel';
const GYOSA = 'https://artist4rhythm-hub.github.io/gyosa-seongyosa';
const $ = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => { const d = ts?.seconds ? new Date(ts.seconds*1000) : new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };

let ME=null, LINKS=[], NEWS=[];
// «마지막으로 확인한 시각» — 이 시각 이후 글에 ● 이 붙는다 (기기별, 서버 비용 0)
const SEEN_KEY = 'parent_seen_daniel';
let prevSeen = 0; try{ prevSeen = Number(localStorage.getItem(SEEN_KEY)||0); }catch(e){}

window.logout = async () => { await signOut(auth); location.href='login.html'; };
window.toggleNews = () => { $('newslist').classList.toggle('show'); };

window.saveName = async () => {
  const n = $('p-name').value.trim();
  const msg = $('name-msg'); msg.className='alert';
  if(n.length < 2){ msg.className='alert err'; msg.textContent='성함을 두 글자 이상 입력해 주세요.'; return; }
  try{
    await updateDoc(doc(db,'parents',auth.currentUser.uid), { name:n });
    ME.name = n; paintGreet();
    msg.className='alert ok'; msg.textContent='저장했습니다 ✓';
    setTimeout(()=>{ $('name-card').style.display='none'; }, 900);
  }catch(e){ msg.className='alert err'; msg.textContent='저장하지 못했습니다: '+(e.message||''); }
};

function myKids(){ return LINKS.filter(l => (l.org||'daniel') === ORG); }
// ── 프로필 아바타: 사진 > 이모지 > 이니셜(이름 기반 자동 배색) ──
const AV_EMOJIS = ['🕊','🦉','🌿','🫒','🌊','⚓','🎻','🎹','📖','✒️','🕯','🌙','⭐','🏔','🌾','🍇'];
const AV_BGS    = ['#EAF1F7','#F1EDE3','#E7F1EA','#EFEAE0','#E4EEF2','#E9EDF2','#F2EAE6','#EDE9F2',
                   '#F0EDE4','#EAE7F0','#F5EFE2','#E6E9F0','#F4F0E2','#E9EFEA','#F1EFE4','#EFE7EE'];
function avColor(name){ let h=0; for(const c of String(name||'')) h=(h*31+c.charCodeAt(0))>>>0; return AV_BGS[h%AV_BGS.length]; }
function avatarHTML(p, size){
  const s = size||34, f = Math.round(s*0.46);
  const ph = (p&&typeof p.photo==='string' && p.photo.startsWith('data:image/')) ? p.photo : '';
  if(ph) return `<img src="${ph}" alt="" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;flex:none">`;
  if(p&&p.avatar) return `<span style="width:${s}px;height:${s}px;border-radius:50%;background:${avColor(p.name)};display:inline-flex;align-items:center;justify-content:center;font-size:${f}px;flex:none">${p.avatar}</span>`;
  const ini = (p&&p.name||'?').trim().charAt(0)||'?';
  return `<span style="width:${s}px;height:${s}px;border-radius:50%;background:var(--hero);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(s*0.4)}px;font-weight:800;flex:none">${ini}</span>`;
}
// 사진 압축 — 128px 정사각 JPEG (문서에 안전하게 내장되는 크기)
function compressAvatar(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{ try{
      const S=128, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
      const cx=cv.getContext('2d');
      const m=Math.min(img.width,img.height);
      cx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      const url=cv.toDataURL('image/jpeg',0.82);
      if(url.length>140000) rej(new Error('사진이 너무 복잡해요 — 다른 사진으로 시도해 주세요.'));
      else res(url);
    }catch(e){rej(e);} };
    img.onerror = ()=>rej(new Error('사진을 읽지 못했습니다.'));
    img.src = URL.createObjectURL(file);
  });
}
// 호칭(관계) — 강제하지 않는다: 안 고르면 «보호자»로 표기
const RELS = ['어머니','아버지','할머니','할아버지','보호자'];
let AV_SEL = null;   // {avatar, photo} 편집 중 선택값
function paintAvEditor(){
  const cur = { name: $('me-name-in').value || ME.name, avatar: AV_SEL.avatar, photo: AV_SEL.photo };
  $('av-preview').innerHTML = avatarHTML(cur, 44);
  $('av-emojis').innerHTML = AV_EMOJIS.map(e=>`<button type="button" class="btnline"
    style="width:34px;height:34px;padding:0;border-radius:50%;font-size:16px;background:${avColor($('me-name-in').value||ME.name)};${AV_SEL.avatar===e&&!AV_SEL.photo?'border:2px solid var(--pt)':''}"
    onclick="pickAvEmoji('${e}')">${e}</button>`).join('');
}
window.pickAvEmoji = (e)=>{ AV_SEL.avatar = (AV_SEL.avatar===e && !AV_SEL.photo) ? '' : e; AV_SEL.photo=''; paintAvEditor(); };
window.clearAvatar = ()=>{ AV_SEL = { avatar:'', photo:'' }; paintAvEditor(); };
window.openMeEdit = () => {
  $('me-edit').style.display='flex';
  AV_SEL = { avatar: ME.avatar||'', photo: ME.photo||'' };
  $('me-name-in').value = ME.name || '';
  paintAvEditor();
  const fi = $('av-file');
  if(fi && !fi._wired){ fi._wired = true;
    fi.addEventListener('change', async ()=>{
      const f = fi.files && fi.files[0]; if(!f) return;
      const msg = $('me-msg'); msg.className='alert';
      try { AV_SEL.photo = await compressAvatar(f); AV_SEL.avatar=''; paintAvEditor(); }
      catch(e){ msg.className='alert err'; msg.textContent = e.message||'사진 처리에 실패했습니다.'; }
      fi.value='';
    });
  }
  $('rel-chips').innerHTML = RELS.map(r=>`<button type="button" class="btnline rel-chip" data-rel="${r}"
    style="padding:6px 12px;font-size:12px;${(ME.relation||'')===r?'color:var(--pt);border-color:var(--pt);font-weight:800':''}"
    onclick="pickRel(this)">${r}</button>`).join('');
};
window.pickRel = (el) => {
  document.querySelectorAll('.rel-chip').forEach(b=>{ b.style.color=''; b.style.borderColor=''; b.style.fontWeight=''; });
  if(el.dataset.rel === (window._selRel||ME.relation)){ window._selRel=''; return; }   // 다시 누르면 해제
  window._selRel = el.dataset.rel;
  el.style.color='var(--pt)'; el.style.borderColor='var(--pt)'; el.style.fontWeight='800';
};
// ── 🔔 웹푸시: 허용 → 기기 토큰을 내 프로필에 저장 (규칙 v11 필요) ──
async function setupPushRow(){
  try {
    if(!('Notification' in window) || !('serviceWorker' in navigator)) return;   // 미지원 기기
    const cfg = await getDoc(doc(db,'parentConfig','push'));
    const vk = cfg.exists() ? (cfg.data().vapidKey || cfg.data().vapidkey || '') : '';   // 대소문자 표기 모두 허용
    if(!vk) return;    // 아직 학교가 알림을 켜지 않음
    window.__vapid = vk;
    const row = $('push-row'); if(!row) return;
    row.style.display = '';
    if(Notification.permission === 'granted' && localStorage.getItem('push_on_daniel')==='1'){
      $('push-btn').textContent = '✓ 알림 받는 중';
      $('push-btn').disabled = true;
    }
  } catch(e){}
}
window.enablePush = async () => {
  const btn = $('push-btn');
  try {
    btn.disabled = true; btn.textContent = '설정 중…';
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ btn.disabled=false; btn.textContent='알림 켜기';
      alert('알림이 허용되지 않았어요. 브라우저 설정에서 알림을 허용해 주세요.'); return; }
    const { getMessaging, getToken } =
      await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js');
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: window.__vapid, serviceWorkerRegistration: reg });
    if(!token) throw new Error('토큰을 만들지 못했습니다.');
    await updateDoc(doc(db,'parents',auth.currentUser.uid), { fcmTokens: arrayUnion(token) });
    try{ localStorage.setItem('push_on_daniel','1'); }catch(e){}
    btn.textContent = '✓ 알림 받는 중';
  } catch(e){
    btn.disabled = false; btn.textContent = '알림 켜기';
    alert('알림 설정에 실패했어요: ' + (e.message||''));
  }
};
window.saveMe = async () => {
  const n = $('me-name-in').value.trim();
  const msg = $('me-msg'); msg.className='alert';
  if(n.length < 2){ msg.className='alert err'; msg.textContent='성함을 두 글자 이상 입력해 주세요.'; return; }
  const rel = window._selRel !== undefined ? window._selRel : (ME.relation||'');
  try{
    await updateDoc(doc(db,'parents',auth.currentUser.uid),
      { name:n, relation:rel, avatar: AV_SEL?.avatar||'', photo: AV_SEL?.photo||'' });
    ME.name=n; ME.relation=rel; ME.avatar=AV_SEL?.avatar||''; ME.photo=AV_SEL?.photo||'';
    $('me-name').textContent = n + (rel?` (${rel})`:'');
    paintGreet();
    msg.className='alert ok'; msg.textContent='저장했습니다 ✓';
    setTimeout(()=>{ $('me-edit').style.display='none'; }, 800);
  }catch(e){ msg.className='alert err'; msg.textContent='저장하지 못했습니다: '+(e.message||''); }
};
function paintGreet(){
  const kid1 = myKids()[0];
  $('greet').textContent = (ME.relation && kid1) ? `${kid1.studentName} ${ME.relation}, 안녕하세요`
    : ME.name ? `${ME.name}님, 안녕하세요` : '안녕하세요 👋';
  const hb = document.querySelector('.hero-me');
  if(hb) hb.innerHTML = avatarHTML(ME, 34);
  $('kidsline').textContent = myKids().map(k=>`${k.studentName||'학생'}${k.grade?' · '+k.grade:''}${k.className?' '+k.className:''}`).join('  ·  ');
}

onAuthStateChanged(auth, async (user)=>{
  if(!user){ location.replace('login-daniel.html'); return; }
  try{
    const pref = doc(db,'parents',user.uid);
    const ps = await getDoc(pref);
    ME = ps.exists() ? ps.data() : {};
    const snap = await getDocs(query(collection(db,'parentLinks'),
      where('parentUid','==',user.uid), where('status','==','active')));
    LINKS=[]; snap.forEach(d=>LINKS.push(d.data()));
    const kids = myKids();
    if(!kids.length){
      // 이 기관 자녀가 없는 계정 — 자동으로 서로 던지지 않는다 (무한 왕복 방지)
      // ① 다른 기관 자녀가 있으면: 10초 안에 이미 옮긴 적이 없을 때만 한 번 이동
      // ② 그 외: 이 기관 연결 화면(add 모드 = 자동 이동 없음)으로
      // 👩‍🏫 교직원 계정이면 자녀 연결 대신 교사 모드 게시판으로
      try {
        const st = await getDoc(doc(db,'staff',user.uid));
        if(st.exists()){ location.replace(`board.html?org=${ORG}&scope=org`); return; }
      } catch(e){}
      const otherOrg = (LINKS.find(l=>(l.org||'daniel')!==ORG)||{}).org;
      let hops = 0; try{
        const now = Date.now();
        hops = JSON.parse(sessionStorage.getItem('pv_hops')||'[]').filter(t=>now-t<10000).length;
        sessionStorage.setItem('pv_hops', JSON.stringify(
          [...JSON.parse(sessionStorage.getItem('pv_hops')||'[]').filter(t=>now-t<10000), now]));
      }catch(e){}
      if(otherOrg && hops < 2){ location.replace('home-'+otherOrg+'.html'); return; }
      if(!otherOrg && hops < 2){ location.replace('login-daniel.html?add=1'); return; }
      // 이동이 잦으면 멈추고 화면 안에서 안내한다
      $('loading').innerHTML = `이 계정에는 다니엘 아마츠 자녀가 연결되어 있지 않아요.<br><br>
        ${otherOrg?`<a href="home-${otherOrg}.html" style="font-weight:800;color:var(--pt)">내 자녀 기관 홈으로 가기 →</a><br><br>`:''}
        <a href="login-daniel.html?add=1" style="font-weight:800;color:var(--pt)">가입코드로 다니엘 아마츠 자녀 연결하기 →</a>`;
      return;
    }

    try{ localStorage.setItem('parent_org', ORG); }catch(e){}
    const orgs = [...new Set(LINKS.map(l=>l.org||'daniel'))];
    try{ await updateDoc(pref, { orgs: arrayUnion(...orgs), lastSeen: Timestamp.now() }); }catch(e){}

    // 두 기관 자녀 가정에게만 교차 링크
    if(orgs.length>1) $('cross').style.display='block';
    if(!ME.name) $('name-card').style.display='';
    paintGreet();

    // 빠른 이동
    const cls = kids.find(k=>k.className)?.className || '';
    const addP = u => u + (u.includes('?')?'&':'?') + 'pfrom=' + ORG;   // 복귀 바 신호
    $('q-fam').href  = addP(`${GYOSA}/share-family.html?org=${ORG}`);
    $('q-board').href = cls ? `board.html?org=${ORG}&scope=class` : `board.html?org=${ORG}&scope=org`;
    $('fam-all').href = $('q-fam').href;
    $('board-all').href = $('q-board').href;
    $('board-title').textContent = cls ? `💬 ${cls} 게시판` : '💬 전체 게시판';

    // 학교 등록 링크 (학사일정·시간표)
    let PL = {};
    try{ const ls = await getDoc(doc(db,'parentConfig','links_'+ORG)); if(ls.exists()) PL = ls.data(); }catch(e){}
    if(PL.academic){ $('q-cal').href = addP(PL.academic); }
    else { $('q-cal').style.opacity='.45'; $('q-cal').onclick = e=>{ e.preventDefault(); alert('학사일정 링크가 아직 연결되지 않았어요.'); }; }

    // ── 데이터 로드: 통신문 목록 + 반/전체 게시판 ──
    let famItems = [];
    try{
      const ix = await getDoc(doc(db,'sharedFamily','_index'));
      const items = ix.exists() && Array.isArray(ix.data().items) ? ix.data().items : [];
      famItems = items.filter(it=>(it.org||'daniel')===ORG).slice(0,3);
    }catch(e){}
    let posts = [];
    try{
      const conds = [where('org','==',ORG), where('scope','==', cls?'class':'org')];
      if(cls) conds.push(where('classKey','==',cls));
      const psnap = await getDocs(query(collection(db,'parentPosts'), ...conds));
      psnap.forEach(d=>posts.push({id:d.id, ...d.data()}));
      posts.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    }catch(e){}

    // ── 카드 채우기 ──
    const isNewF = it => (it.at||0) > prevSeen;
    $('fam-list').innerHTML = famItems.length ? famItems.map(it=>`
      <a class="item ${isNewF(it)?'':'read'}" href="${addP(`${GYOSA}/share-family.html?id=${it.id}`)}">
        <div class="t">${esc(it.title||'(제목 없음)')}${isNewF(it)?'<span class="dot">●</span>':''}</div>
        <div class="m">${fmt(it.at)}${isNewF(it)?' · 안 읽음':''}</div>
      </a>`).join('')
      : '<div class="empty-line">아직 발행된 통신문이 없어요.</div>';

    const isNewP = p => ((p.createdAt?.seconds||0)*1000) > prevSeen;
    $('board-list').innerHTML = posts.length ? posts.slice(0,2).map(p=>`
      <a class="item ${isNewP(p)?'':'read'}" href="board.html?org=${ORG}&scope=${cls?'class':'org'}#post-${esc(p.id)}">
        <div class="t">${p.pinned?'📌 ':''}${esc(p.title)}${isNewP(p)?'<span class="dot">●</span>':''}</div>
        <div class="m">${esc(p.authorName||'')}${p.byStaff?' 선생님':''} · 💬 ${p.commentCount||0} · ${fmt(p.createdAt)}</div>
      </a>`).join('')
      : '<div class="empty-line">아직 글이 없어요 — 첫 이야기를 남겨 보세요.</div>';

    // ── 새 소식 배너 ──
    NEWS = [
      ...famItems.filter(isNewF).map(it=>({ icon:'📨', t:it.title||'가정통신문', at:it.at,
        href:addP(`${GYOSA}/share-family.html?id=${it.id}`) })),
      ...posts.filter(isNewP).slice(0,3).map(p=>({ icon:'💬', t:p.title, at:(p.createdAt?.seconds||0)*1000,
        href:`board.html?org=${ORG}&scope=${cls?'class':'org'}#post-${p.id}` })),
    ].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,4);
    if(NEWS.length){
      $('news-t').textContent = `🔔 새 소식 ${NEWS.length}건이 도착했어요`;
      $('newslist').innerHTML = NEWS.map(n=>`<a href="${esc(n.href)}">${n.icon} <span style="flex:1">${esc(n.t)}</span><small>${fmt(n.at)}</small></a>`).join('');
    } else {
      $('newsbar').classList.add('quiet');
      $('news-t').textContent = '새 소식이 없어요 — 오늘도 평안한 하루 되세요 🕊';
      $('newsbar').onclick = null;
    }

    // 더 보기
    const mi=(href,t,d)=>`<a href="${href}"><div class="mt">${t}</div><div class="md">${d}</div></a>`;
    $('more').innerHTML =
      mi(`board.html?org=${ORG}&scope=org`, '📢 전체 게시판', '기관 전체 학부모와 소통해요')
      + (PL.timetable ? mi(addP(PL.timetable),'🗓 시간표','우리 아이 시간표 확인') : `<div class="off"><div class="mt">🗓 시간표</div><div class="md">학교에서 링크 연결 시 열려요</div></div>`)
      + mi(addP(`${GYOSA}/parent-expense.html?org=${ORG}`), '💳 환급 계좌', '경비 환급 계좌 등록')
      + mi(`login-daniel.html?add=1`, '🎫 자녀 추가 연결', '가입코드로 자녀를 더 연결해요');

    // 내 정보
    $('me-name').textContent = (ME.name || '보호자') + (ME.relation?` (${ME.relation})`:'');
    setupPushRow();
    $('me-email').textContent = user.email || '';
    $('kids').innerHTML = kids.map(k=>`<span class="kid">👦 ${esc(k.studentName||'학생')}<small>${k.grade?'· '+esc(k.grade):''} ${esc(k.className||'')}</small></span>`).join('')
      + `<a class="kid-add" href="login-daniel.html?add=1">＋ 자녀 추가</a>`;

    // 이번 방문을 «확인 시각»으로 기록 → 다음 방문부터는 이 이후 글만 새 소식
    try{ localStorage.setItem(SEEN_KEY, String(Date.now())); }catch(e){}

    $('loading').style.display='none';
    $('main').style.display='';
  }catch(e){
    $('loading').textContent = '불러오지 못했습니다: ' + (e.message||'');
  }
});
</script>
