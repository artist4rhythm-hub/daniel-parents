<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 서비스</title>
<script>
// 옛 링크 호환 — 기관을 이미 고른 학부모는 그 기관 로그인으로,
// 처음이면 기관 선택 화면으로 보낸다. (두 기관이 한 화면에 섞이지 않도록)
(function(){
  // 로그인 후 돌아갈 주소(next)를 잃지 않고 기관 로그인으로 넘긴다
  var q = location.search || '';
  try{
    var o = localStorage.getItem('parent_org');
    if(o==='daniel'){ location.replace('login-daniel.html'+q); return; }
    if(o==='jihyebit'){ location.replace('login-jihyebit.html'+q); return; }
  }catch(e){}
  location.replace('index.html');
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:40vh;color:#6A737B">
  이동 중입니다… <a href="index.html">바로 가기</a>
</p>
</body>
</html>
