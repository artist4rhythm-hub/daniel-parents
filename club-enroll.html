<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방과후 동아리 · 조이클래스</title>
<meta name="theme-color" content="#0C2A44">
<link rel="icon" type="image/png" href="logo-daniel-color.png">
<style>
:root{--pt:#0C2A44;--gold:#D8B45A;--cream:#FBFAF7;--ink:#22262B;--ink2:#5A5F66;--ink3:#8A8F98;--line:#E7E4DC;--wh:#fff}
body.jihyebit{--pt:#5E4B8B;--gold:#F0E8FA}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:50;background:var(--pt);color:#fff;padding:11px 14px;font-size:13.5px;font-weight:800;text-align:center}
.bar a{color:#fff;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--wh);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:900;color:var(--pt);margin-bottom:8px}
.kid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kid button{border:1.5px solid var(--line);background:var(--wh);border-radius:100px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.kid button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.club{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.club .t{font-size:14.5px;font-weight:900}
.club .m{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.55}
.club select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;font-weight:800;background:var(--wh)}
.club.r1{border-color:var(--pt);background:#F5F8FB}
.pill{display:inline-block;border-radius:100px;padding:2px 9px;font-size:10.5px;font-weight:800;background:#F1F0EC;color:#6B7280}
.pill.ok{background:#DCFCE7;color:#15803D}.pill.blue{background:#DBEAFE;color:#1D4ED8}.pill.warn{background:#FEF3C7;color:#B45309}.pill.bad{background:#FEE2E2;color:#B91C1C}
.btn{background:var(--pt);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.line{background:var(--wh);color:var(--ink2);border:1.5px solid var(--line)}
.alert{display:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}.alert.err{display:block;background:#FDECEA;color:#C0392B}.alert.warn{display:block;background:#FEF3C7;color:#B45309}
.small{font-size:11.5px;color:var(--ink3)}
.res{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
details summary{cursor:pointer;font-size:12.5px;color:var(--ink2);font-weight:700}

/* ── 공개 공고 페이지 · 폰 최적화 ── */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(0,0,0,.22);animation:slideup .18s ease}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px;padding:22px 20px}}
@keyframes slideup{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.modal h3{font-size:16px;font-weight:900;color:var(--pt)}
.modal label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:12px 0 5px}
.modal input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:16px;background:#fff}
.modal input:focus{outline:none;border-color:var(--pt)}
.row{display:flex;gap:8px}
.rank{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rank button{border:1.5px solid var(--line);background:var(--wh);border-radius:10px;padding:10px 8px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2);flex:1;min-width:70px}
.rank button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto}
body.has-save .wrap{padding-bottom:130px}
/* ── 공고 카드: 핵심 정보 박스 ── */
.meta2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px}
.meta2>span{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink)}
.meta2 b{font-size:10px;color:var(--ink3);font-weight:800;letter-spacing:.02em}
.meta2 i{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:700;margin-left:2px}
.cintro{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid #EFE6CE;font-size:12px;color:var(--ink2);line-height:1.65}
.strip{display:grid;grid-template-columns:1.12fr 1fr 1fr;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:11px;background:var(--row)}
.strip>div{padding:9px 4px 8px;text-align:center}
.strip>div+div{border-left:1px solid var(--line)}
.strip .lb{font-size:10px;color:var(--ink3);font-weight:700}
.strip .v{font-size:12.8px;font-weight:900;color:var(--pt);margin-top:2px;line-height:1.3;word-break:keep-all}
.strip .s{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.mdates{margin-top:9px;padding:3px 12px 5px;border:1px solid var(--line);border-radius:12px;background:var(--wh)}
.mdates .r{display:grid;grid-template-columns:36px 1fr;gap:8px;font-size:12px;padding:6px 0;align-items:baseline}
.mdates .r+.r{border-top:1px dashed var(--line)}
.mdates .mo{font-weight:900;color:var(--pt)}
.mdates .ds{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.85}
.mdates em{font-style:normal;color:#6D28D9;font-weight:900}
.mdates u{text-decoration:none;color:#C2410C;font-weight:900}
.pill.x{background:#F3EEFC;color:#6D28D9}
.pill.t{background:#FDF0E7;color:#C2410C}
details.plan>summary{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);cursor:pointer;list-style:none;font-size:13px;font-weight:900;color:var(--pt)}
details.plan>summary::-webkit-details-marker{display:none}
details.plan>summary i{font-style:normal;font-size:11px;color:var(--ink3);font-weight:700}
details.plan>summary i::before{content:'펼쳐보기 ▾'}
details.plan[open]>summary i::before{content:'접기 ▴'}
.prow{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:10px 8px;border-radius:9px}
.prow:nth-child(even){background:var(--row)}
.pn{width:26px;height:26px;border:1.5px solid var(--pt);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;color:var(--pt);background:var(--wh);margin:0 auto}
.pd{font-size:10px;color:var(--ink3);text-align:center;margin-top:4px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}
.ptt{font-size:13px;font-weight:800;color:var(--ink);line-height:1.45}
.pc{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.62}
/* ── 주간 한눈표 ── */
.tt-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;color:var(--pt)}
.tt-head i{font-style:normal;font-size:11px;color:var(--ink3);font-weight:700}
.wgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px -6px 0;padding:0 6px 6px;scroll-snap-type:x proximity;scroll-padding-left:50px}
.wg{display:grid;gap:5px}
.wg .h{background:var(--pt);color:#fff;font-size:11.5px;font-weight:900;text-align:center;padding:7px 0;border-radius:10px}
.wg .corner,.wg .tcol{position:sticky;left:0;z-index:4;background:var(--wh)}
.wg .tcol{position:sticky}
.wg .tcol i{position:absolute;right:7px;font-size:10.5px;font-weight:700;color:var(--ink3);font-style:normal;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wg .day{position:relative;background:var(--wh);border:1px solid #EFECE4;border-radius:12px;background-image:repeating-linear-gradient(to bottom,transparent 0 39px,#F2EFE7 39px 40px);scroll-snap-align:start}
.wb{position:absolute;border-radius:8px;padding:5px 6px;overflow:hidden;background:#EEF3F8;border-left:3px solid var(--pt2,#1E4B74)}
.wb.joy{background:#FBF4E3;border-left-color:#B08A2E}
.wb.sel{box-shadow:0 0 0 2px var(--gold);border-left-color:var(--gold)}
.wb{cursor:pointer;transition:opacity .18s}
.wb.dim{opacity:.24;filter:grayscale(.5)}
.wb .bt{font-size:12px;font-weight:900;color:var(--pt);line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wb.joy .bt{color:#7A5D14}
.wb .gb{display:inline-block;margin-top:3px;font-size:10px;font-weight:900;background:var(--pt);color:#fff;border-radius:8px;padding:2px 8px}
.wb.joy .gb{background:#B08A2E}
.wb .bm{font-size:10.5px;color:var(--ink2);margin-top:2px;font-weight:700;font-variant-numeric:tabular-nums}
.wb .bi{font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb .bs{position:absolute;top:4px;right:5px;font-size:9.5px;font-weight:900;color:#8A6A16}
.legend{display:flex;gap:12px;margin-top:10px;font-size:10.5px;color:var(--ink2);font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;font-style:normal}
.gfil{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.gfil button{border:1.5px solid var(--line);background:var(--wh);border-radius:10px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.gfil button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.club{scroll-margin-top:64px}
.club.flash{animation:cflash 1.3s ease}
@keyframes cflash{0%,55%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.info-rows{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info-rows .ir{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:8px 12px;font-size:12.5px}
.info-rows .ir:nth-child(even){background:var(--row)}
.info-rows .ir b{color:var(--ink3);font-size:11px;font-weight:800;padding-top:1px}
.info-rows .ir span{font-weight:700;color:var(--ink)}
/* ── 자녀 바 · 신청 요약 · 저장 팝업 · 업데이트 배너 ── */
.kadd{border:1.5px dashed var(--line);background:var(--row);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:800;color:var(--pt2);cursor:pointer;font-family:inherit}
.kreset{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:700;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sumhead b{font-size:13.5px;font-weight:900;color:var(--pt)}
.sumhead span{font-size:11px;color:var(--ink3);font-weight:700}
.rgrp{margin-top:10px}
.rgrp .rl{font-size:11px;font-weight:900;color:var(--gold);background:var(--pt);display:inline-block;border-radius:7px;padding:2px 9px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px 9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow .tt{font-size:13px;font-weight:800;color:var(--ink)}
.rrow .tm{font-size:11px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow .ovb{font-size:10px;color:#B45309;font-weight:800}
.sumfoot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);font-weight:700}
.modal.pop .pop-ck{width:54px;height:54px;border-radius:50%;background:#DCFCE7;color:#15803D;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto}
.modal.pop .pop-list{margin-top:13px;border:1px solid var(--line);border-radius:12px;padding:2px 13px}
.updbar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--pt);color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;padding:9px 14px calc(9px + env(safe-area-inset-top));font-size:12.5px;font-weight:800;box-shadow:0 4px 14px rgba(12,42,68,.25)}
.updbar button{background:var(--gold);color:#20303F;border:0;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:900;font-family:inherit;cursor:pointer}
body.has-upd{padding-top:46px}
</style>
</head>
<body>
<div class="bar" id="topbar">방과후 동아리 · 조이클래스</div>
<div class="wrap">
  <div class="card" id="head"><h3>🎨 동아리 · 조이클래스 신청</h3><div class="small">불러오는 중…</div></div>
  <div id="main"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const $ = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const ORG = qs.get('org')==='jihyebit' ? 'jihyebit' : 'daniel';
document.body.classList.toggle('jihyebit', ORG==='jihyebit');
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
document.title = `${ORGS[ORG]} 방과후 동아리 · 조이클래스`;
document.getElementById('topbar').textContent = `${ORGS[ORG]} · 방과후 동아리 · 조이클래스`;
if(ORG==='jihyebit') document.querySelector('link[rel="icon"]').setAttribute('href','logo-jihyebit.png');
let PUBLIC = false, SEM_ANY = null;
const LOGIN_URL = `login-${ORG}.html?next=${encodeURIComponent('club-enroll.html?org='+ORG)}`;
const WD = ['일','월','화','수','목','금','토'];
const toMin = t => { const [h,m]=String(t||'0:0').split(':').map(Number); return h*60+m; };

let ME=null, KIDS=[], SEM=null, CLUBS=[], ENR={}, KID=null;
const PTHEMES = { navy:['#0C2A44','#1E4B74','#D8B45A'], forest:['#1E3932','#2E5A47','#EAD9A0'],
  plum:['#5E4B8B','#8A6FC0','#F6EDFF'], sunset:['#B4530A','#E28413','#FFF3DF'], ink:['#22262B','#4A5560','#E8E4DA'] };
function posterHTML(c, h){
  if(c.poster) return `<img src="${c.poster}" style="width:100%;height:${h}px;object-fit:cover;border-radius:10px;display:block">`;
  const [a,b,pt] = PTHEMES[c.posterTheme] || PTHEMES.navy;
  return `<div style="position:relative;height:${h}px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,${a},${b});display:flex;flex-direction:column;justify-content:center;padding:10px 14px">
    <div style="position:absolute;right:-22px;top:-22px;width:84px;height:84px;border-radius:50%;background:${pt};opacity:.18"></div>
    <div style="font-size:9.5px;font-weight:800;letter-spacing:.12em;color:${pt}">${c.type==='joy'?'JOY CLASS':'AFTER SCHOOL'}</div>
    <div style="font-size:${(c.title||'').length>10?15:18}px;font-weight:900;color:#fff;line-height:1.25;margin-top:2px;word-break:keep-all">${esc(c.title||'')}</div>
    <div style="font-size:10px;font-weight:700;color:${pt};margin-top:4px">강사 ${esc(c.instructorName||'')}</div>
  </div>`;
}
function eligOf(c){   // 자녀 학년으로 신청 가능 여부: ok | no | unknown
    if(PUBLIC) return 'ok';
  if(!c.gradeSel || !c.gradeSel.length) return 'ok';
  if(!KID?.grade) return 'unknown';
  return c.gradeSel.includes(KID.grade) ? 'ok' : 'no';
}

onAuthStateChanged(auth, async user=>{
  ME = user || null;
  PUBLIC = !user;
  if(user && user.isAnonymous){
    // ✍️ 간편 신청 세션 — 같은 브라우저에서 확인해 둔 자녀로 이어간다
    await loadSem();
    if(!SEM){ await loadSemAny(); renderPrep(); return; }
    await loadClubs();
    if(simpleKids().length){ await enterSimple(); }
    else { PUBLIC = true; renderHead(); renderMain(); PUBLIC = false; }
    return;
  }
  if(PUBLIC){
    // 🔓 열람 모드 — 링크만 받으면 로그인 없이 공고를 보고, 신청 버튼에서 로그인
    await loadSem();
    if(!SEM){ await loadSemAny(); renderPrep(); return; }
    await loadClubs();
    renderHead(); renderMain();
    return;
  }
  const ls = await getDocs(query(collection(db,'parentLinks'), where('parentUid','==',user.uid), where('status','==','active')));
  KIDS = ls.docs.map(d=>({id:d.id, ...d.data()})).filter(k=>(k.org||'daniel')===ORG);
  await loadSem();
  if(!SEM){ await loadSemAny(); renderPrep(); return; }
  if(!KIDS.length){
    $('head').innerHTML = `<h3>🎨 동아리 신청</h3><div class="small">이 기관에 연결된 자녀가 없어요. 학교에서 받은 <b>가입코드</b>로 자녀를 연결해 주세요. (공고 열람은 아래에서 가능해요)</div>
      <div style="margin-top:8px"><a class="btn line" style="text-decoration:none;padding:8px 12px;font-size:12.5px" href="${LOGIN_URL}">🔗 가입코드로 자녀 연결하기</a></div>`;
    await loadClubs(); PUBLIC = true; renderMain(); PUBLIC = false; return;
  }
  await loadClubs(); await loadEnr();
  KID = KIDS[0]; renderHead(); renderMain();
});
async function loadSemAny(){
  const snap = await getDocs(query(collection(db,'clubSemesters'), where('org','==',ORG)));
  const list = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(x=>x.status!=='locked')
    .sort((a,b)=>String(b.rangeFrom||'').localeCompare(String(a.rangeFrom||'')));
  SEM_ANY = list[0] || null;
}
function renderPrep(){
  const es = SEM_ANY ? (SEM_ANY.milestones||[]).find(m=>m.role==='enrollStart') : null;
  const ee = SEM_ANY ? (SEM_ANY.milestones||[]).find(m=>m.role==='enrollEnd') : null;
  $('head').innerHTML = `<h3>🎨 ${SEM_ANY?esc(SEM_ANY.name)+' ':''}동아리 · 조이클래스 <span class="pill warn">공고 준비 중</span></h3>
    <div class="small" style="line-height:1.8">${ORGS[ORG]} · 강사 개설·취합이 진행되고 있어요.<br>

async function loadSem(){

}
async function loadClubs(){

    .sort((a,b)=>((a.weekdays||[])[0]||9)-((b.weekdays||[])[0]||9) || toMin(a.start)-toMin(b.start));

async function loadEnr(){
  const snap = await getDocs(query(collection(db,'clubEnrollments'), where('semId','==',SEM.id), where('parentUid','==',ME.uid)));

}
const fee = c => Math.round(((c.type==='joy'?SEM.feeJoy:SEM.feeClub)||0) * (c.durMin||0) / 60);
const bkm = () => { const m={}; (SEM?.blocked||[]).forEach(b=>{ if(b.date) m[b.date]=b.reason; }); return m; };
const isOff = (s,m) => s.skip || (!s.extra && !s.override && (s.blocked || m[s.date]));
const live = c => { const m=bkm(); return (c.sessions||[]).filter(s=>!isOff(s,m)).length; };
const semTotal = c => { const rate=(c.type==='joy'?SEM.feeJoy:SEM.feeClub)||0; const m=bkm();
  return (c.sessions||[]).filter(s=>!isOff(s,m)).reduce((t,s)=>t+Math.round(rate*((s.durMin||c.durMin||0))/60),0); };
function ms(role){ return (SEM.milestones||[]).find(m=>m.role===role) || null; }
const STL = { enrolling:['신청 접수중','ok'], adjusting:['순위 조정·최종 결정','blue'], confirmed:['확정','ok'], running:['운영중','ok'] };
const fmtMin = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const endOf = c => fmtMin(toMin(c.start)+(c.durMin||0));
const wdN = c => (c.weekdays||[]).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6);
const clashDays = (a,b) => {              // 요일 교집합이 없으면 무조건 [] — 요일이 다르면 절대 안 겹침
  const B = wdN(b); const days = wdN(a).filter(w=>B.includes(w));
  if(!days.length) return [];
  const a0=toMin(a.start), a1=a0+(Number(a.durMin)||0), b0=toMin(b.start), b1=b0+(Number(b.durMin)||0);
  return (a0<b1 && b0<a1) ? days : [];
};
const timeClash = (a,b) => clashDays(a,b).length > 0;
const mdShort = d => d ? `${+String(d).slice(5,7)}.${+String(d).slice(8,10)}` : '';
const wdOf = d => { const p=String(d||'').split('-').map(Number); if(p.length<3) return ''; return WD[new Date(p[0],p[1]-1,p[2]).getDay()]||''; };
const liveSess = c => { const m=bkm(); return (c.sessions||[]).filter(x=>!isOff(x,m)); };
const gShort = c => { const g=c.gradeSel||[]; if(!g.length) return esc(c.grades||'전체');
  const ns=g.map(x=>parseInt(x)).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  if(ns.length===g.length && ns.length){ let cont=true; for(let i=1;i<ns.length;i++) if(ns[i]!==ns[i-1]+1){cont=false;break;}
    if(cont) return ns.length>1?`${ns[0]}~${ns[ns.length-1]}학년`:`${ns[0]}학년`; return ns.join('·')+'학년'; }
  return g.map(esc).join('·'); };
const sessMark = x => x.extra ? `<span class="pill x">${esc(x.extraLabel||'보강')}${(x.start||x.durMin)?` ${x.start||''}${x.durMin?' '+x.durMin+'분':''}`:''}</span>`
  : x.override ? `<span class="pill t">휴강일 진행${x.start?` 🕒${x.start}`:''}</span>`
  : (x.start||x.durMin) ? `<span class="pill t">🕒 ${x.start||''}${x.durMin?' '+x.durMin+'분':''}</span>` : '';
const monthRows = c => { const by={}; liveSess(c).forEach(x=>{ const mo=+String(x.date).slice(5,7); (by[mo]=by[mo]||[]).push(x); });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(mo=>{
    const parts = by[mo].map(x=>{ const d=+String(x.date).slice(8,10), w=wdOf(x.date), lab=`${d}(${w})`;
      if(x.extra) return `<em>${lab}</em>${sessMark(x)}`;
      if(x.override || x.start || x.durMin) return `<u>${lab}</u>${sessMark(x)}`;
      return lab; }).join(' · ');
    return `<div class="r"><span class="mo">${mo}월</span><span class="ds">${parts}</span></div>`; }).join(''); };
const planRows = c => liveSess(c).map(x=>{ const tt = x.ctitle ? esc(x.ctitle) : (esc(x.content||'').trim()||'수업');
  return `<div class="prow"><div><div class="pn">${x.no}</div><div class="pd">${mdShort(x.date)}<br>${wdOf(x.date)}</div></div>
    <div><div class="ptt">${tt} ${sessMark(x)}</div>${x.ctitle&&x.content?`<div class="pc">${esc(x.content)}</div>`:''}</div></div>`; }).join('');

function weekGridHTML(picks){
  if(!CLUBS.length) return '';
  const P=2.0, s0=toMin(SEM.timeStart), s1=toMin(SEM.timeEnd), H=Math.max(120,(s1-s0)*P);
  const BW=150, GAP=6, PAD=4;   // 블록 절대 폭 — 겹치는 만큼 그 요일이 옆으로 넓어진다
  if(window.__gsel===undefined) window.__gsel = (KID && KID.grade) ? [KID.grade] : [];
  const sel = window.__gsel;
  const allows = c => !(c.gradeSel&&c.gradeSel.length) || sel.every(g=>c.gradeSel.includes(g));
  const gs = [...new Set(CLUBS.flatMap(c=>c.gradeSel||[]))].sort((a,b)=>{const na=parseInt(a),nb=parseInt(b);
    if(!isNaN(na)&&!isNaN(nb))return na-nb; if(!isNaN(na))return -1; if(!isNaN(nb))return 1; return String(a).localeCompare(String(b),'ko');});
  window.__glist = gs;
  // 파스텔 배색 — 동아리는 차분한 톤, 조이클래스는 따뜻한 톤 (개설 순서로 순환)
  const PALC=[['#E7F0FA','#1E4B74'],['#E8F5EE','#1E6B4B'],['#EFEBFA','#5B3FA8'],['#E6F4F6','#0F6672'],['#EDF2E7','#4A6B1F']];
  const PALJ=[['#FDF3E2','#8A5A12'],['#FBECE7','#A34A2A'],['#F9EDF4','#8A3D6E']];
  const PMAP={}; let ci=0, ji=0;
  CLUBS.forEach(c=>{ PMAP[c.id] = c.type==='joy' ? PALJ[ji++ % PALJ.length] : PALC[ci++ % PALC.length]; });
  const colWs=[];
  const cols=[1,2,3,4,5].map(w=>{
    const evs = CLUBS.filter(c=>(c.weekdays||[]).includes(w)).map(c=>({c,s:toMin(c.start),e:toMin(c.start)+(c.durMin||60)})).sort((a,b)=>a.s-b.s||a.e-b.e);
    const lanes=[]; evs.forEach(ev=>{ let li=lanes.findIndex(t=>t<=ev.s); if(li<0){ li=lanes.length; lanes.push(0); } lanes[li]=ev.e; ev.l=li; });
    const L=Math.max(1,lanes.length);
    colWs.push(PAD*2 + L*BW + (L-1)*GAP);
    const blocks=evs.map(ev=>{ const c=ev.c, pal=PMAP[c.id], top=(ev.s-s0)*P+2, h=Math.max(42,(ev.e-ev.s)*P-4), r=picks[c.id];
      const dim = sel.length && !allows(c);
      return `<div class="wb ${r?'sel':''} ${dim?'dim':''}" onclick="wbInfo('${c.id}')" style="top:${top}px;height:${h}px;left:${PAD+ev.l*(BW+GAP)}px;width:${BW}px;background:${pal[0]};border-left-color:${pal[1]}">
        <div class="bt" style="color:${pal[1]}">${esc(c.title)}</div><span class="gb" style="background:${pal[1]}">${gShort(c)}</span>
        <div class="bm">${c.start} – ${endOf(c)}</div><div class="bi">👤 ${esc(c.instructorName||'')}</div>${r?`<div class="bs">${r}순위</div>`:''}</div>`; }).join('');
    return `<div class="day" style="height:${H}px">${blocks}</div>`; });
  const gridCols = `46px ${colWs.map(x=>x+'px').join(' ')}`;
  const minW = 46 + 25 + colWs.reduce((a,b)=>a+b,0);
  let tl=''; for(let t=s0;t<=s1;t+=40) tl+=`<i style="top:${(t-s0)*P}px">${fmtMin(t)}</i>`;
  let ov='';
  if(!PUBLIC){
    const chosen=Object.keys(picks).map(id=>CLUBS.find(c=>c.id===id)).filter(Boolean);
    if(chosen.length){ let clash=false;
      for(let i=0;i<chosen.length;i++) for(let j=i+1;j<chosen.length;j++){ const a=chosen[i], b=chosen[j];
        if(timeClash(a,b)) clash=true; }
      ov = `<div class="small" style="margin-top:8px">${clash?'<span style="color:#B45309;font-weight:800">⚠ 내가 고른 동아리 중 시간이 겹치는 조합이 있어요 — 겹치면 순위가 높은 것만 배정됩니다.</span>':'내가 고른 동아리끼리 겹치는 시간 없음 — 모두 참여할 수 있어요.'}</div>`; }
  }
  const selLab = sel.length ? sel.slice().sort((a,b)=>{const na=parseInt(a),nb=parseInt(b);
    if(!isNaN(na)&&!isNaN(nb))return na-nb; return String(a).localeCompare(String(b),'ko');}).join('·') : '';
  return `<div class="card" id="wgcard" style="margin-top:12px"><div class="tt-head">🗓 이번 학기 주간 시간표 <i>${SEM.timeStart} – ${SEM.timeEnd} · 옆으로 넘겨 보세요 →</i></div>
    <div class="gfil"><button class="${!sel.length?'on':''}" onclick="wgGrade(null)">전체 학년</button>${gs.map((g,i)=>`<button class="${sel.includes(g)?'on':''}" onclick="wgGrade(window.__glist[${i}])">${esc(g)}</button>`).join('')}</div>
    <div class="wgwrap"><div class="wg" style="grid-template-rows:auto ${H}px;grid-template-columns:${gridCols};min-width:${minW}px">
      <div class="corner"></div>${[1,2,3,4,5].map(w=>`<div class="h">${WD[w]}</div>`).join('')}
      <div class="tcol">${tl}</div>${cols.join('')}
    </div></div>
    <div class="legend"><span><i style="background:#E7F0FA;border-left:3px solid #1E4B74"></i>동아리 · 차분한 톤</span><span><i style="background:#FDF3E2;border-left:3px solid #8A5A12"></i>조이클래스 · 따뜻한 톤</span>${!PUBLIC?`<span><i style="background:#fff;box-shadow:0 0 0 2px var(--gold);border-radius:3px"></i>내가 고른 동아리</span>`:''}${sel.length?`<span style="color:var(--ink3)">진한 블록 = ${esc(selLab)} 모두 신청 가능</span>`:''}</div>${ov}</div>`;
}
window.wgGrade = (g)=>{
  const cur = window.__gsel || [];
  window.__gsel = (g===null) ? [] : (cur.includes(g) ? cur.filter(x=>x!==g) : [...cur, g]);
  const el = document.getElementById('wgcard'); if(el) el.outerHTML = weekGridHTML(window.__picks||{});
};
window.wbInfo = (id)=>{
  const c = CLUBS.find(x=>x.id===id); if(!c) return;
  const sess = liveSess(c); const from = c.startDate || (sess[0]&&sess[0].date) || ''; const to = c.endDate || (sess.length&&sess[sess.length-1].date) || '';
  const r = (window.__picks||{})[id];
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal">
    ${posterHTML(c, 84)}
    <h3 style="margin-top:10px"><span class="pill ${c.type==='joy'?'blue':'ok'}">${c.type==='joy'?'조이클래스':'동아리'}</span> ${esc(c.title)} ${r?`<span class="pill blue">${r}순위 신청함</span>`:''}</h3>
    <div class="info-rows">
      <div class="ir"><b>요일·시간</b><span>매주 ${(c.weekdays||[]).filter(w=>WD[w]).map(w=>WD[w]).join('·')}요일 ${c.start} – ${endOf(c)}</span></div>
      <div class="ir"><b>수업 기간</b><span>${mdShort(from)} – ${mdShort(to)} · 총 ${sess.length}회</span></div>
      <div class="ir"><b>신청 학년</b><span>${gShort(c)}${c.gradeNote?` <span class="small">(${esc(c.gradeNote)})</span>`:''}</span></div>
      <div class="ir"><b>강사</b><span>${esc(c.instructorName||'')}${c.coInstructors?' · '+esc(c.coInstructors):''}</span></div>
      <div class="ir"><b>회비</b><span>학기 ${semTotal(c).toLocaleString()}원 <span class="small">(1회 ${fee(c).toLocaleString()}원)</span></span></div>
      ${(c.room||c.place)?`<div class="ir"><b>장소</b><span>${esc(c.room||c.place)}</span></div>`:''}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn line" onclick="this.closest('.modal-bg').remove()">닫기</button>
      <button class="btn" onclick="wbGo('${id}')">📄 상세 안내 보기</button></div></div>`;
  document.body.appendChild(bg);
};
window.wbGo = (id)=>{
  document.querySelector('.modal-bg')?.remove();
  const t = document.getElementById('club-'+id); if(!t) return;
  t.scrollIntoView({ behavior:'smooth', block:'start' });
  t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'), 1350);
};

window.setRank = (cid, rank)=>{
  const p = window.__picks; const me = CLUBS.find(c=>c.id===cid);
  if(rank){
    // 시간이 겹치는 동아리끼리만 같은 순위를 못 갖는다 — 겹치지 않으면 각각 1순위도 OK
    Object.keys(p).forEach(k=>{ if(k===cid) return; const o=CLUBS.find(c=>c.id===k);
      if(p[k]===rank && me && o && timeClash(me,o)) delete p[k]; });
    p[cid]=rank;
  } else delete p[cid];
  renderMainKeep(p); };
function renderMainKeep(p){ const e = ENR[KID.studentId] || (ENR[KID.studentId] = {picks:[]}); e.picks = Object.entries(p).map(([clubId,rank])=>({clubId,rank})); renderMain(); }
window.savePicks = async ()=>{
  const e = ENR[KID.studentId]; const picks = e?.picks || [];
  const m=$('msg');
  if(!picks.length){ m.className='alert err'; m.textContent='순위를 하나 이상 골라주세요.'; return; }
  const id = `${SEM.id}_${KID.studentId}`;
  try{
    await setDoc(doc(db,'clubEnrollments', id), { semId:SEM.id, org:ORG, parentUid:ME.uid, studentId:KID.studentId, studentName:KID.studentName||'', className:KID.className||'', grade:KID.grade||'', linkId:KID.id,
      picks, status:'applied', via: SIMPLE?'simple':'account', updatedAt:Timestamp.now(), ...(e?.id?{}:{createdAt:Timestamp.now()}) }, { merge:true });
    const savedItems = picks.slice().sort((a,b)=>a.rank-b.rank).map(p=>{ const c=CLUBS.find(x=>x.id===p.clubId); return c?{r:p.rank, t:c.title, d:(c.weekdays||[]).filter(w=>WD[w]).map(w=>WD[w]).join('·'), s:c.start}:null; }).filter(Boolean);
    await loadEnr(); renderMain(); const mm=$('msg'); mm.className='alert'; mm.textContent='';
    showSavedPop(KID.studentName||'', savedItems);
  }catch(err){ m.className='alert err'; m.textContent='저장 실패: '+(err.code==='permission-denied'?(SEM.status==='enrolling'?'이 학생은 이미 다른 기기(또는 학부모 계정)에서 신청되어 있어요 — 처음 신청한 곳에서 수정하거나 학교에 문의해 주세요.':'지금은 신청 기간이 아닙니다.'):(err.message||'')); }
};
function snapJS(p){ return JSON.stringify(Object.entries(p).map(([k,v])=>[k,Number(v)]).sort((a,b)=>a[0]<b[0]?-1:1)); }
function summaryCard(picks){
  if(PUBLIC || !KID) return '';
  const sel = Object.entries(picks).map(([id,r])=>({ c:CLUBS.find(x=>x.id===id), r:Number(r) })).filter(x=>x.c).sort((a,b)=>a.r-b.r);
  const saved = ENR[KID.studentId];
  const savedJS = snapJS(Object.fromEntries((saved?.picks||[]).map(p=>[p.clubId, p.rank])));
  const dirty = snapJS(picks) !== savedJS;
  if(!sel.length) return `<div class="card"><div class="sumhead"><b>📌 ${esc(KID.studentName)}의 신청 현황</b></div>
    <div class="small" style="margin-top:8px">아직 고른 동아리가 없어요 — 아래 목록에서 순위 버튼을 눌러 담아보세요.</div></div>`;
  let pairs = 0; const clashSet = new Set();
  for(let i=0;i<sel.length;i++) for(let j=i+1;j<sel.length;j++) if(timeClash(sel[i].c, sel[j].c)){ pairs++; clashSet.add(sel[i].c.id); clashSet.add(sel[j].c.id); }
  const grp = {1:[],2:[],3:[]}; sel.forEach(x=>{ (grp[x.r]=grp[x.r]||[]).push(x.c); });
  const dayLab = c => (c.weekdays||[]).filter(w=>WD[w]).map(w=>WD[w]).join('·');
  const rows = r => grp[r].map(c=>`<div class="rrow" onclick="wbGo('${c.id}')"><span class="tt">${esc(c.title)}${clashSet.has(c.id)?' <span class="ovb">⏱ 겹침</span>':''}</span><span class="tm">${dayLab(c)} ${c.start}–${endOf(c)}</span></div>`).join('');
  return `<div class="card"><div class="sumhead"><b>📌 ${esc(KID.studentName)}의 신청 현황</b><span>줄을 탭하면 그 동아리로 이동</span></div>
    ${[1,2,3].filter(r=>grp[r]&&grp[r].length).map(r=>`<div class="rgrp"><span class="rl">${r}순위</span>${rows(r)}</div>`).join('')}
    <div class="sumfoot"><span>모두 <b>${sel.length}개</b> 선택${pairs?` · 겹침 ${pairs}조합`:''}</span><span>${dirty?'<b style="color:#B45309">● 저장 전 변경분 — 아래 [신청 저장]을 눌러주세요</b>':'✓ 저장됨'}</span></div></div>`;
}
window.showSavedPop = (name, items)=>{
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal pop">
    <div class="pop-ck">✓</div>
    <h3 style="text-align:center;margin-top:12px">신청이 저장됐어요</h3>
    <div class="small" style="text-align:center;margin-top:2px">${esc(name)} · 동아리 ${items.length}개</div>
    <div class="pop-list">${items.map(it=>`<div class="rrow"><span class="tt"><b style="color:var(--pt2)">${it.r}순위</b> ${esc(it.t)}</span><span class="tm">${it.d} ${it.s}</span></div>`).join('')}</div>
    <div class="small" style="text-align:center;margin-top:11px;line-height:1.7">신청 마감 전까지 언제든 다시 들어와 수정할 수 있어요.<br>배정 결과는 «순위 조정·최종 결정» 단계부터 이 화면에 표시됩니다.</div>
    <button class="btn" style="width:100%;margin-top:14px;padding:13px" onclick="this.closest('.modal-bg').remove()">확인</button></div>`;
  document.body.appendChild(bg);
};
window.resetLinks = ()=>{
  const names = KIDS.map(k=>k.studentName).join(' · ');
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal" style="text-align:center">
    <h3>자녀 연결을 초기화할까요?</h3>
    <div class="small" style="margin-top:6px;line-height:1.75">이 기기에 기억된 자녀 연결(${esc(names)})만 지워집니다.<br><b style="color:var(--ink)">이미 저장된 신청 내용은 그대로 안전하게 보관</b>되고,<br>같은 이름·생년월일로 다시 확인하면 즉시 이어집니다.</div>
    <div class="row" style="margin-top:14px"><button class="btn line" style="flex:1" onclick="this.closest('.modal-bg').remove()">취소</button>
    <button class="btn" style="flex:1;background:#B45309" onclick="doResetLinks()">초기화</button></div></div>`;
  document.body.appendChild(bg);
};
window.doResetLinks = ()=>{ try{ localStorage.removeItem(SKEY); localStorage.removeItem(CURKEY); sessionStorage.removeItem(SKEY); }catch(e){} location.reload(); };
/* ── ✨ 업데이트 알림 — version.json의 v가 바뀌면 상단 배너 ── */
const BUILD = '2026.09.03-01';
async function checkUpdate(){ try{
  const r = await fetch('version.json?_='+Date.now(), { cache:'no-store' });
  const j = await r.json(); if(j && j.v && j.v !== BUILD) showUpd();
}catch(e){} }
function showUpd(){ if(document.getElementById('updbar')) return;
  const d = document.createElement('div'); d.id='updbar'; d.className='updbar';
  d.innerHTML = `✨ 업데이트 되었습니다 <button onclick="location.reload()">새 화면 보기</button>`;
  document.body.appendChild(d); document.body.classList.add('has-upd'); }
checkUpdate(); setInterval(checkUpdate, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(); });

window.setFinal = async (cid, v)=>{
  const e = ENR[KID.studentId]; if(!e?.id) return;
  const fin = {...(e.final||{})}; fin[cid]=v;
  try{ await updateDoc(doc(db,'clubEnrollments',e.id), { final: fin, finalAt: Timestamp.now() }); e.final=fin; renderMain(); }
  catch(err){ alert('저장 실패: '+(err.message||'')); }
};
</script>
